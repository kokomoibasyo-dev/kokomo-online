<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>南風原偉人フローチャート｜試験版</title></head><body><p style="font-family:sans-serif;padding:24px">読み込み中…</p><script>(async()=>{const BUILD='202608292003';const r=await fetch('/kokomo-online/haebaru-ijin/index.html?build='+BUILD,{cache:'no-store'});if(!r.ok)throw new Error('base load failed');let s=await r.text();
// test-mode copy
s=s.replace('50問のストックから毎回20問をランダムに出題し、あなたのものの見方や行動の傾向と重なる南風原ゆかりの人物を紹介します。','【試験版】現在は画像表示確認のため、1問だけ回答すると結果が表示されます。');
s=s.replace('20問 ｜ 所要時間 約3〜4分 ｜ 6タイプ','試験版：1問 ｜ 6タイプ');
s=s.replace('出題は6タイプの偏りが大きくならないように50問からランダム抽出します。','現在は表示確認用の1問試験モードです。完成後に20問ランダム出題へ戻します。');
s=s.replace('別の20問でもう一度','もう一度試す');
const css=`
.question{min-height:150px!important;display:flex!important;align-items:center!important;margin-top:10px!important;margin-bottom:24px!important}
.answers{margin-top:0!important}
.portrait{position:relative!important;overflow:hidden!important;width:min(88vw,440px)!important;aspect-ratio:100/64!important;background:#f3efe4!important}
.portrait svg{display:none!important}
.direct-portrait{width:100%!important;height:100%!important;display:block!important;object-fit:cover!important;object-position:center!important}
@media(max-width:560px){.question{min-height:165px!important}.portrait{width:min(90vw,390px)!important}}
`;
s=s.replace('</style>',css+'</style>');
// direct per-person image files; no sprite cropping
const a=s.indexOf('function art(kind)');const b=s.indexOf('const profiles=',a);if(a<0||b<0)throw new Error('art function not found');
s=s.slice(0,a)+`function art(kind){return \`<img class="direct-portrait" src="/kokomo-online/haebaru-ijin-v2/portraits/\${kind}.jpg?build=${BUILD}" alt="人物イラスト" decoding="sync">\`}\n`+s.slice(b);
// inject one-answer test behavior after the base script has defined answer()
s=s.replace('</body>',`<script>(function(){
  const setup=()=>{
    const original=window.answer;
    if(typeof original!=='function'||window.__oneQuestionTest)return;
    window.__oneQuestionTest=true;
    window.answer=function(v){for(let i=0;i<20;i++) original(v)};
    const qc=document.getElementById('qCount');
    if(qc){const keep=()=>{if(!document.getElementById('quiz').classList.contains('hidden'))qc.textContent='1 / 1';};keep();new MutationObserver(keep).observe(document.getElementById('quiz'),{attributes:true,subtree:true,childList:true});}
  };
  setTimeout(setup,0);
})();<\/script></body>`);
document.open();document.write(s);document.close()})().catch(e=>{console.error(e);document.body.innerHTML='<p style="font-family:sans-serif;padding:24px">読み込みに失敗しました。再読み込みしてください。</p>'})</script></body></html>
