name: Deploy Kokomo Online to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Build high resolution portraits from original source
        run: |
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from PIL import Image, ImageFilter
          src='haebaru-ijin/haebaru-portraits.jpg'
          out='haebaru-ijin-v2/haebaru-portraits-hq.jpg'
          im=Image.open(src).convert('RGB')
          print('Original portraits:', im.size)
          scale=4
          up=im.resize((im.width*scale, im.height*scale), Image.Resampling.LANCZOS)
          up=up.filter(ImageFilter.UnsharpMask(radius=1.4, percent=135, threshold=2))
          up.save(out,'JPEG',quality=96,optimize=True,progressive=False,subsampling=0)
          check=Image.open(out)
          check.verify()
          print('HQ portraits verified:', up.size)
          PY
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
