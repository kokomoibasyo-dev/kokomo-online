name: Deploy Kokomo Online to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Build high resolution portraits
        run: |
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from PIL import Image, ImageFilter, ImageFile
          ImageFile.LOAD_TRUNCATED_IMAGES = True
          src='haebaru-ijin/haebaru-portraits.jpg'
          out='haebaru-ijin-v2/haebaru-portraits-hq.jpg'
          im=Image.open(src).convert('RGB')
          up=im.resize((im.width*4, im.height*4), Image.Resampling.LANCZOS)
          up=up.filter(ImageFilter.UnsharpMask(radius=1.1, percent=115, threshold=3))
          up.save(out, 'JPEG', quality=92, optimize=True, progressive=True, subsampling=0)
          print('HQ portraits:', up.size)
          PY
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
