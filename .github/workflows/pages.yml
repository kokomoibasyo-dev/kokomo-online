name: Deploy Kokomo Online to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Build six direct portrait files from verified source
        run: |
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from PIL import Image
          import base64, os
          src_b64='haebaru-ijin-v2/portraits-valid.jpg.b64'
          restored='haebaru-ijin-v2/portraits-source.jpg'
          with open(src_b64,'r',encoding='utf-8') as f:
              raw=''.join(f.read().split())
          with open(restored,'wb') as f:
              f.write(base64.b64decode(raw))
          im=Image.open(restored).convert('RGB')
          W,H=im.size
          print('verified portrait source:', im.size)
          tw,th=W//3,H//2
          names=['tobi','yumi','yama','ippa','kame','tetsu']
          os.makedirs('haebaru-ijin-v2/portraits',exist_ok=True)
          for i,name in enumerate(names):
              row,col=divmod(i,3)
              tile=im.crop((col*tw,row*th,(col+1)*tw,(row+1)*th))
              # 2x display source; no broken-image recovery and no aggressive filtering
              tile=tile.resize((960,600),Image.Resampling.LANCZOS)
              out=f'haebaru-ijin-v2/portraits/{name}.jpg'
              tile.save(out,'JPEG',quality=96,subsampling=0,optimize=True)
              check=Image.open(out); check.verify()
              print(name, os.path.getsize(out))
          PY
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
