name: Deploy Kokomo Online to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Build six direct portrait files
        run: |
          python3 -m pip install --quiet pillow opencv-python-headless numpy
          python3 - <<'PY'
          from PIL import Image, ImageFile
          import numpy as np, cv2, os
          ImageFile.LOAD_TRUNCATED_IMAGES=True
          src='haebaru-ijin/haebaru-portraits.jpg'
          im=Image.open(src); im.load(); im=im.convert('RGB')
          W,H=im.size; tw,th=W//3,H//2
          names=['tobi','yumi','yama','ippa','kame','tetsu']
          os.makedirs('haebaru-ijin-v2/portraits',exist_ok=True)
          for i,name in enumerate(names):
            row,col=divmod(i,3)
            tile=np.array(im.crop((col*tw,row*th,(col+1)*tw,(row+1)*th)))[:,:,::-1]
            tile=cv2.resize(tile,(1280,880),interpolation=cv2.INTER_LANCZOS4)
            # conservative enhancement: retain the original drawing, avoid artificial overprocessing
            blur=cv2.GaussianBlur(tile,(0,0),1.0)
            tile=cv2.addWeighted(tile,1.45,blur,-0.45,0)
            out=f'haebaru-ijin-v2/portraits/{name}.jpg'
            cv2.imwrite(out,tile,[cv2.IMWRITE_JPEG_QUALITY,98])
            check=Image.open(out); check.verify()
            print(name, out, os.path.getsize(out))
          PY
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
