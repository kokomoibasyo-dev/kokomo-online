name: Deploy Kokomo Online to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Build six super-resolution portrait files
        run: |
          python3 -m pip install --quiet pillow opencv-contrib-python-headless numpy
          curl -L --fail --retry 3 -o /tmp/EDSR_x4.pb https://github.com/Saafke/EDSR_Tensorflow/raw/master/models/EDSR_x4.pb
          python3 - <<'PY'
          from PIL import Image, ImageFile
          import cv2, numpy as np, os
          ImageFile.LOAD_TRUNCATED_IMAGES=True
          src='haebaru-ijin/haebaru-portraits.jpg'
          im=Image.open(src); im.load(); im=im.convert('RGB')
          W,H=im.size
          print('source:', im.size)
          tw,th=W//3,H//2
          names=['tobi','yumi','yama','ippa','kame','tetsu']
          os.makedirs('haebaru-ijin-v2/portraits',exist_ok=True)
          sr=cv2.dnn_superres.DnnSuperResImpl_create()
          sr.readModel('/tmp/EDSR_x4.pb')
          sr.setModel('edsr',4)
          for i,name in enumerate(names):
              row,col=divmod(i,3)
              tile=np.array(im.crop((col*tw,row*th,(col+1)*tw,(row+1)*th)))[:,:,::-1]
              up=sr.upsample(tile)
              # keep the illustration clean without over-sharpening
              blur=cv2.GaussianBlur(up,(0,0),0.8)
              up=cv2.addWeighted(up,1.18,blur,-0.18,0)
              out=f'haebaru-ijin-v2/portraits/{name}.jpg'
              cv2.imwrite(out,up,[cv2.IMWRITE_JPEG_QUALITY,96])
              chk=Image.open(out); chk.verify()
              print(name, up.shape[1], up.shape[0], os.path.getsize(out))
          PY
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
