name: Deploy Kokomo Online to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Build high resolution portraits
        run: |
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from PIL import Image, ImageFilter
          import base64, io, pathlib
          src = pathlib.Path('haebaru-ijin-v2/portraits-valid.jpg.b64').read_text().strip()
          raw = base64.b64decode(src)
          im = Image.open(io.BytesIO(raw)).convert('RGB')
          up = im.resize((im.width*6, im.height*6), Image.Resampling.LANCZOS)
          up = up.filter(ImageFilter.UnsharpMask(radius=1.0, percent=105, threshold=2))
          out = 'haebaru-ijin-v2/haebaru-portraits-hq.jpg'
          up.save(out, 'JPEG', quality=94, optimize=True, progressive=True, subsampling=0)
          check = Image.open(out)
          check.verify()
          print('HQ portraits verified:', up.size)
          PY
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
