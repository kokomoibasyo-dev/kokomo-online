name: Inspect greek-name-v4 semantic logic
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-greek-kanji.yml"
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract source tail
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path("greek-name-v4/index.html").read_text(encoding="utf-8")
          Path("greek-name-v4/debug_kanji_context.txt").write_text(s[-30000:],encoding="utf-8")
          PY
      - name: Commit diagnostic
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add greek-name-v4/debug_kanji_context.txt
          git commit -m "chore: inspect greek app source tail" || exit 0
          git push
