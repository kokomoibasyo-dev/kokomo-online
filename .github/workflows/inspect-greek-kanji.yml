name: Inspect greek-name-v4 kanji data
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-greek-kanji.yml"
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract context around 珠
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("greek-name-v4/index.html")
          s = p.read_text(encoding="utf-8")
          parts=[]
          start=0
          n=0
          while True:
              i=s.find("珠", start)
              if i<0: break
              n += 1
              parts.append(f"--- occurrence {n} at {i} ---\n"+s[max(0,i-1800):i+2600])
              start=i+1
          Path("greek-name-v4/debug_kanji_context.txt").write_text("\n\n".join(parts) if parts else "NO_OCCURRENCE", encoding="utf-8")
          PY
      - name: Commit diagnostic
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add greek-name-v4/debug_kanji_context.txt
          git commit -m "chore: inspect kanji context" || exit 0
          git push
