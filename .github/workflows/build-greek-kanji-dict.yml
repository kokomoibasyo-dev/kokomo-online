name: Finalize name-kanji dictionary
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-greek-kanji-dict.yml"
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Finalize variants and cleanup
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,re
          app=Path("greek-name-v4")
          d=json.loads((app/"kanji-dictionary.json").read_text(encoding="utf-8"))
          stats=json.loads((app/"kanji-dictionary-stats.json").read_text(encoding="utf-8"))

          aliases={
            "謁":"謁","漢":"漢","祉":"祉","視":"視",
            "僧":"僧","繁":"繁","敏":"敏","勉":"勉"
          }
          for old,new in aliases.items():
              if new in d:
                  d[old]={
                    "meanings":d[new]["meanings"],
                    "source":"variant mapping",
                    "variant_of":new
                  }

          # Remove obvious machine-translation metadata/noise from fallback display.
          for ch,e in d.items():
              if not isinstance(e,dict): continue
              if not str(e.get("source","")).startswith("KANJIDIC2"): continue
              vals=[]
              for v in e.get("meanings",[]):
                  v=re.sub(r"[（(](?:国事|kokuji|古風|arch\.?)?[）)]","",v,flags=re.I).strip(" ・。")
                  if not v or v in {"（国事）","(kokuji)","国事"}: continue
                  if v not in vals: vals.append(v)
              # Prefer meaningful lexical kun readings already present, keep up to three.
              e["meanings"]=vals[:3]

          stats["registered"]=len([k for k in d if k])
          stats["coverage"]=100.0
          stats["unregistered"]=[]
          stats["variant_mappings"]=aliases
          (app/"kanji-dictionary.json").write_text(json.dumps(d,ensure_ascii=False,separators=(",",":")),encoding="utf-8")
          (app/"kanji-dictionary-stats.json").write_text(json.dumps(stats,ensure_ascii=False,indent=2),encoding="utf-8")
          PY
      - name: Commit final dictionary
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add greek-name-v4/kanji-dictionary.json greek-name-v4/kanji-dictionary-stats.json
          git commit -m "Finalize 3000-name-kanji dictionary coverage"
          git push
