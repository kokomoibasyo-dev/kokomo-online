name: Fill remaining kanji from rendered Wiktionary text
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-greek-kanji-dict.yml"
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fill from rendered extracts
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,re,urllib.parse,urllib.request,time
          app=Path("greek-name-v4")
          d=json.loads((app/"kanji-dictionary.json").read_text(encoding="utf-8"))
          stats=json.loads((app/"kanji-dictionary-stats.json").read_text(encoding="utf-8"))
          missing=list(stats.get("unregistered",[]))
          headers={"User-Agent":"kokomo-greek-name-dictionary/1.0"}

          def parse_extract(txt):
              vals=[]
              txt=txt or ""
              # Direct semantic phrase from etymology/character explanation.
              for pat in [
                  r"「([^」\n]{1,30})」を意味する",
                  r"「([^」\n]{1,30})」を表す",
                  r"([^。\n]{1,25})を意味する漢語",
              ]:
                  for m in re.finditer(pat,txt):
                      x=m.group(1).strip(" 、。「」")
                      if x and x not in vals and len(x)<=30: vals.append(x)
              # Explicit character-meaning section when present.
              m=re.search(r"(?:^|\n)字義\s*\n(.*?)(?=\n(?:日本語|中国語|朝鮮語|コード等|字源|熟語)\s*\n|\Z)",txt,re.S)
              if m:
                  for line in m.group(1).splitlines():
                      x=re.sub(r"^\s*\d+[.．)]?\s*","",line).strip(" ・。")
                      if 1<=len(x)<=60 and x not in vals: vals.append(x)
              # Expanded kun readings are a safe lexical fallback.
              if not vals:
                  for m in re.finditer(r"訓読み\s*[:：]?\s*([^\n]+)",txt):
                      x=m.group(1)
                      x=re.sub(r"表内|表外|常用漢字表内|常用漢字表外|古訓.*","",x)
                      for part in re.split(r"[、,／/ ]+",x):
                          part=re.sub(r"\([^)]*\)|\[[^]]*\]","",part)
                          part=part.replace("-","").strip(" ・")
                          if re.fullmatch(r"[ぁ-ゖー]+",part) and 1<len(part)<=12 and part not in vals:
                              vals.append(part)
                      if vals: break
              return vals[:3]

          added=0
          for i in range(0,len(missing),20):
              batch=missing[i:i+20]
              params={
                "action":"query","format":"json","formatversion":"2",
                "prop":"extracts","explaintext":"1","exsectionformat":"plain",
                "titles":"|".join(batch)
              }
              req=urllib.request.Request("https://ja.wiktionary.org/w/api.php?"+urllib.parse.urlencode(params),headers=headers)
              try:
                  with urllib.request.urlopen(req,timeout=90) as r: obj=json.load(r)
              except Exception:
                  time.sleep(.5); continue
              for page in obj.get("query",{}).get("pages",[]):
                  ch=page.get("title","")
                  vals=parse_extract(page.get("extract",""))
                  if vals:
                      d[ch]={"meanings":vals,"source":"Japanese Wiktionary rendered text"}
                      added+=1
              time.sleep(.1)

          still=[c for c in missing if c not in d]
          stats["registered"]=len(d)
          stats["coverage"]=round(len(d)/max(1,stats.get("name_kanji_unique",3000))*100,1)
          stats["rendered_extract_added"]=added
          stats["unregistered"]=still
          (app/"kanji-dictionary.json").write_text(json.dumps(d,ensure_ascii=False,separators=(",",":")),encoding="utf-8")
          (app/"kanji-dictionary-stats.json").write_text(json.dumps(stats,ensure_ascii=False,indent=2),encoding="utf-8")
          PY
      - name: Commit dictionary
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add greek-name-v4/kanji-dictionary.json greek-name-v4/kanji-dictionary-stats.json
          git commit -m "Fill remaining kanji from rendered Wiktionary text"
          git push
