name: Inspect KANJIDIC shape
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-greek-kanji-dict.yml"
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect
        run: |
          python - <<'PY'
          import json,urllib.request
          from pathlib import Path
          with urllib.request.urlopen("https://raw.githubusercontent.com/jkindrix/japanese-language-data/main/data/core/kanji.json",timeout=180) as r:
              kd=json.load(r)
          out={"root_type":str(type(kd))}
          if isinstance(kd,dict):
              out["root_keys"]=list(kd.keys())[:20]
              for k,v in kd.items():
                  if isinstance(v,list) and v and isinstance(v[0],dict):
                      out["list_key"]=k
                      out["first"]=v[0]
                      for e in v:
                          if e.get("literal")=="穏" or e.get("character")=="穏" or e.get("kanji")=="穏":
                              out["穏"]=e; break
                      break
          elif isinstance(kd,list):
              out["first"]=kd[0] if kd else None
              for e in kd:
                  if isinstance(e,dict) and ("穏" in (e.get("literal"),e.get("character"),e.get("kanji"))):
                      out["穏"]=e;break
          Path("greek-name-v4/kanjidic-sample.json").write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding="utf-8")
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add greek-name-v4/kanjidic-sample.json
          git commit -m "chore: inspect KANJIDIC structure"
          git push
