name: Inspect Japanese kanji dictionary source
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-greek-kanji-dict.yml"
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect Wiktionary-derived hanzi data
        run: |
          python - <<'PY'
          import json, urllib.request
          from pathlib import Path
          url="https://raw.githubusercontent.com/michel-ZH/yomichan-dictionaries/master/japanese/kanji/wiktionary/hanziData.json"
          with urllib.request.urlopen(url,timeout=180) as r:
              data=json.load(r)
          out={"type":str(type(data)),"len":len(data)}
          if isinstance(data,dict):
              out["keys"]=list(data)[:20]
              out["珠"]=data.get("珠")
          elif isinstance(data,list):
              out["first"]=data[:3]
              hits=[x for x in data if isinstance(x,dict) and (x.get("kanji")=="珠" or x.get("character")=="珠" or x.get("word")=="珠")]
              out["珠"]=hits[:3]
          Path("greek-name-v4/source-inspect.json").write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding="utf-8")
          PY
      - name: Commit inspection
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add greek-name-v4/source-inspect.json
          git commit -m "chore: inspect Japanese kanji source"
          git push
