name: Fill kanji dictionary from Japanese Wiktionary
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-greek-kanji-dict.yml"
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fill remaining kanji meanings
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, re, urllib.parse, urllib.request, time, html

          app=Path("greek-name-v4")
          d=json.loads((app/"kanji-dictionary.json").read_text(encoding="utf-8"))
          stats=json.loads((app/"kanji-dictionary-stats.json").read_text(encoding="utf-8"))
          missing=list(stats.get("unregistered",[]))

          def plain(s):
              # Remove refs/comments.
              s=re.sub(r"<ref[^>]*>.*?</ref>","",s,flags=re.S)
              s=re.sub(r"<ref[^>]*/>","",s)
              s=re.sub(r"<!--.*?-->","",s,flags=re.S)
              # Replace wiki links with visible text.
              s=re.sub(r"\[\[([^\]|]+)\|([^\]]+)\]\]",r"\2",s)
              s=re.sub(r"\[\[([^\]]+)\]\]",r"\1",s)
              # Remove simple templates repeatedly.
              for _ in range(5):
                  ns=re.sub(r"\{\{[^{}]*\}\}","",s)
                  if ns==s: break
                  s=ns
              s=re.sub(r"\[https?://[^ ]+\s+([^\]]+)\]",r"\1",s)
              s=re.sub(r"https?://\S+","",s)
              s=s.replace("'''","").replace("''","")
              s=re.sub(r"^[:;#*]+\s*","",s)
              s=re.sub(r"\s+"," ",s).strip(" 。;；:")
              return html.unescape(s)

          def extract_defs(wt):
              # Find the 字義 section in the kanji portion.
              m=re.search(r"(?ms)^===+\s*字義\s*===+\s*$\n(.*?)(?=^={2,6}\s*[^=\n]+\s*={2,6}\s*$|\Z)",wt)
              blocks=[]
              if m: blocks.append(m.group(1))
              # Some pages use 意義/意味 instead.
              if not blocks:
                  m=re.search(r"(?ms)^===+\s*(?:意義|意味)\s*===+\s*$\n(.*?)(?=^={2,6}\s*[^=\n]+\s*={2,6}\s*$|\Z)",wt)
                  if m: blocks.append(m.group(1))
              vals=[]
              for block in blocks:
                  for line in block.splitlines():
                      if not re.match(r"^\s*[#*;:]",line): continue
                      x=plain(line)
                      x=re.sub(r"^\d+[.)．]\s*","",x)
                      if not x or len(x)>100: continue
                      if x.startswith(("字源","異体字","部首","総画")): continue
                      if x not in vals: vals.append(x)
              return vals[:3]

          headers={"User-Agent":"kokomo-greek-name-dictionary/1.0 (GitHub Pages educational app)"}
          added=0
          for i in range(0,len(missing),40):
              batch=missing[i:i+40]
              params={
                  "action":"query","format":"json","formatversion":"2",
                  "prop":"revisions","rvprop":"content","rvslots":"main",
                  "titles":"|".join(batch)
              }
              url="https://ja.wiktionary.org/w/api.php?"+urllib.parse.urlencode(params)
              req=urllib.request.Request(url,headers=headers)
              try:
                  with urllib.request.urlopen(req,timeout=90) as r:
                      obj=json.load(r)
              except Exception:
                  time.sleep(1.5)
                  continue
              for page in obj.get("query",{}).get("pages",[]):
                  ch=page.get("title","")
                  revs=page.get("revisions") or []
                  if not revs: continue
                  wt=((revs[0].get("slots") or {}).get("main") or {}).get("content","")
                  vals=extract_defs(wt)
                  if vals:
                      d[ch]={"meanings":vals,"source":"Japanese Wiktionary 字義"}
                      added+=1
              time.sleep(0.15)

          still=[c for c in missing if c not in d]
          stats["registered"]=len(d)
          stats["coverage"]=round(len(d)/max(1,stats.get("name_kanji_unique",3000))*100,1)
          stats["wiktionary_page_added"]=added
          stats["unregistered"]=still
          (app/"kanji-dictionary.json").write_text(json.dumps(d,ensure_ascii=False,separators=(",",":")),encoding="utf-8")
          (app/"kanji-dictionary-stats.json").write_text(json.dumps(stats,ensure_ascii=False,indent=2),encoding="utf-8")
          PY
      - name: Commit completed dictionary
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add greek-name-v4/kanji-dictionary.json greek-name-v4/kanji-dictionary-stats.json
          git commit -m "Fill name-kanji meanings from Japanese Wiktionary"
          git push
