<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>子ども店長名刺帳 v1</title><style>:root{--ink:#24324a;--mut:#6d7890;--line:#dce4ef;--sky:#eaf6ff;--pink:#ffe8f0;--mint:#e8f8ee;--yellow:#fff3bf}*{box-sizing:border-box}body{margin:0;background:linear-gradient(#fff9f1,#f7fbff);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}.app{max-width:520px;margin:auto;min-height:100vh;background:#ffffffc9;padding-bottom:84px}.top{position:sticky;top:0;z-index:5;padding:13px 15px;background:#ffffffed;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center}.top b{flex:1}.top small{display:block;color:var(--mut);font-size:10px;margin-top:2px}.icon{border:0;border-radius:11px;background:#f2f5f9;width:38px;height:38px}main{padding:18px 16px}.ey{display:inline-block;padding:7px 10px;border-radius:99px;background:var(--sky);font-size:12px;font-weight:800}.title{font-size:25px;margin:8px 0 4px}.lead{color:var(--mut);font-size:13px;line-height:1.7;margin:0 0 15px}.card{background:#fff;border:1px solid #e7e7e7;border-radius:25px;overflow:hidden;box-shadow:0 10px 26px #25365617;margin:12px 0 17px}.art{aspect-ratio:16/10;display:grid;place-items:center;font-size:70px;background:linear-gradient(135deg,#ffe7ef,#fff4c9);background-size:cover;background-position:center}.body{padding:17px}.body h2{font-size:26px;margin:0}.shop{font-weight:800;margin:5px 0 9px}.msg{color:#4d5b70;white-space:pre-line;line-height:1.6}.tags{display:flex;gap:6px;flex-wrap:wrap}.tag{font-size:10px;padding:5px 8px;background:#f2f5f9;border-radius:99px}.actions{display:grid;gap:9px}.btn{border:0;border-radius:15px;padding:14px;font-weight:900;font-size:14px;min-height:49px}.blue{background:#3187ec;color:#fff}.pink{background:#f25f8c;color:#fff}.green{background:#42ae6f;color:#fff}.soft{background:#f2f5f9;color:var(--ink);border:1px solid var(--line)}.btn:disabled{opacity:.45}.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px;margin:14px 0}.panel h3{margin:0 0 7px;font-size:15px}.panel p{font-size:12px;color:#56647a;line-height:1.65}.field{width:100%;border:1px solid #cfd9e7;border-radius:13px;padding:12px;font-size:15px;background:#fff}.fg{margin:13px 0}.fg label{display:block;font-size:12px;font-weight:900;margin-bottom:5px}textarea.field{min-height:82px}.preview{aspect-ratio:16/10;border:2px dashed #cad8e7;border-radius:17px;display:grid;place-items:center;font-size:52px;background:#fbfdff;background-size:cover;background-position:center;margin-bottom:8px}.challenge{border-top:1px dashed var(--line);padding:10px 0}.challenge:first-child{border:0}.challenge b{font-size:12px}.challenge p{margin:4px 0;font-size:11px}.center{text-align:center;padding:15px 5px}.center .big{font-size:68px}.note{background:var(--yellow);border-radius:15px;padding:11px 13px;font-size:12px;line-height:1.6;margin:13px 0}.booktop{display:flex;justify-content:space-between;align-items:flex-start}.count{padding:7px 9px;border-radius:99px;background:var(--pink);font-size:11px;font-weight:900}.grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}.mini{border:1px solid var(--line);border-radius:17px;background:#fff;overflow:hidden;padding:0;text-align:left;color:inherit}.miniart{aspect-ratio:1.05;display:grid;place-items:center;font-size:39px;background:#f3f6fa}.minibody{padding:9px}.minibody b{font-size:13px}.minibody span{display:block;font-size:9px;color:var(--mut);margin-top:3px}.readonly{background:#ede9fe;color:#573e9a;border-radius:13px;padding:10px;font-size:11px;font-weight:800;margin-bottom:11px}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);height:74px;background:#ffffffef;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:7px 26px max(7px,env(safe-area-inset-bottom))}.nav button{border:0;background:transparent;color:#7b879a;font-weight:800;font-size:10px}.nav span{display:block;font-size:21px}.nav .on{color:#ed5f89}.toast{position:fixed;bottom:92px;left:50%;transform:translateX(-50%);background:#24324a;color:#fff;border-radius:99px;padding:9px 13px;font-size:11px}</style></head><body><div class="app"><div class="top"><button id="back" class="icon" hidden>←</button><b>✦ 子ども店長名刺帳<small>リアルで出会って、デジタルでのこす。</small></b><button id="reset" class="icon">↻</button></div><main id="main"></main><div id="nav" class="nav"><button data-nav="home" class="on"><span>🏠</span>わたしの名刺</button><button data-nav="book"><span>📖</span>名刺帳</button></div></div><script>const cards={yui:{id:'yui',name:'ゆい店長',shop:'ゆめのスクイーズやさん',emoji:'🌈',msg:'かわいいスクイーズをつくります。\nみんなにももっととどけたい！',tags:['スクイーズ','ものづくり','カラフル'],ch:[{d:'2026.08.23',t:'スクイーズを20こ販売',f:'全部売れてうれしかった！',n:'次は看板も自分でつくりたい。'}]},sora:{id:'sora',name:'そら店長',shop:'そらのパンやさん',emoji:'🥐',msg:'ふわふわのパンが大好き！',tags:['パン','料理'],ch:[]}};let owner=JSON.parse(localStorage.getItem('kt_owner')||'null')||{id:'me',name:'たま店長',shop:'たまのひみつやさん',emoji:'🐸',msg:'みんながえがおになる\nおもしろいことをつくりたい！',tags:['ものづくり','アイデア'],image:null,ch:[{d:'2026.09.10',t:'名刺づくりにチャレンジ',f:'自分の「好き」を名刺にしてみた。',n:'今度は友だちと交換してみたい！'}]};let col=JSON.parse(localStorage.getItem('kt_col')||'[]'),screen='home',incoming=null,selected=null,readonly=false;const m=document.getElementById('main'),nav=document.getElementById('nav'),back=document.getElementById('back');const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const save=()=>{localStorage.setItem('kt_owner',JSON.stringify(owner));localStorage.setItem('kt_col',JSON.stringify(col))};const day=()=>new Intl.DateTimeFormat('ja-JP',{year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date()).replaceAll('/','.');function card(c){return `<div class="card"><div class="art" style="${c.image?`background-image:url('${c.image}')`:''}">${c.image?'':esc(c.emoji)}</div><div class="body"><h2>${esc(c.name)}</h2><div class="shop">${esc(c.shop)}</div><div class="msg">${esc(c.msg)}</div><div class="tags">${(c.tags||[]).map(x=>`<span class="tag">${esc(x)}</span>`).join('')}</div></div></div>`}function chall(c){return c.ch?.length?c.ch.map(x=>`<div class="challenge"><b>${esc(x.d)}｜${esc(x.t)}</b><p>💭 ${esc(x.f)}</p><p>🌱 次は：${esc(x.n)}</p></div>`).join(''):'<p>まだチャレンジ記録はありません。</p>'}function go(s){screen=s;render();scrollTo(0,0)}function home(){m.innerHTML=`<span class="ey">✏️ 自分を表す</span><h1 class="title">わたしの名刺</h1><p class="lead">自分だけの店長名刺。リアルの名刺といっしょに育てていこう。</p>${card(owner)}<div class="actions"><button class="btn blue" data-a="edit">✏️ 名刺を編集する</button><button class="btn soft" data-a="challenges">🌱 これまでのチャレンジ</button><button class="btn green" data-a="book">📖 名刺帳を見る</button></div><div class="panel"><h3>📳 NFCテスト</h3><p>本番はNFCをタッチすると相手の名刺が直接開きます。今はデモで試せます。</p><button class="btn soft" data-a="demo">ゆい店長のNFCをタッチ</button></div>`}function edit(){m.innerHTML=`<span class="ey">🎨 つくる</span><h1 class="title">名刺を編集する</h1><p class="lead">手描き名刺を撮影して、そのままデジタル名刺にできます。</p><form id="ef"><div class="fg"><label>名刺の絵・写真</label><div id="prev" class="preview" style="${owner.image?`background-image:url('${owner.image}')`:''}">${owner.image?'':esc(owner.emoji)}</div><input id="img" class="field" type="file" accept="image/*" capture="environment"></div><div class="fg"><label>店長名</label><input name="name" class="field" value="${esc(owner.name)}"></div><div class="fg"><label>お店の名前</label><input name="shop" class="field" value="${esc(owner.shop)}"></div><div class="fg"><label>ひとこと</label><textarea name="msg" class="field">${esc(owner.msg)}</textarea></div><div class="fg"><label>好きなこと（、で区切る）</label><input name="tags" class="field" value="${esc(owner.tags.join('、'))}"></div><div class="actions"><button type="button" class="btn soft" data-a="addch">🌱 今回のチャレンジを残す</button><button class="btn blue">保存する</button></div></form>`}function addch(){m.innerHTML=`<span class="ey">🌱 ふりかえる</span><h1 class="title">今回のチャレンジ</h1><form id="cf"><div class="fg"><label>なにをした？</label><input name="t" class="field" required></div><div class="fg"><label>どうだった？</label><textarea name="f" class="field" required></textarea></div><div class="fg"><label>つぎはどうしたい？</label><textarea name="n" class="field" required></textarea></div><button class="btn blue">チャレンジを残す</button></form>`}function challenges(){m.innerHTML=`<span class="ey">🌱 これまでとこれから</span><h1 class="title">わたしのチャレンジ</h1><div class="panel">${chall(owner)}</div><button class="btn blue" data-a="addch">＋ 新しく残す</button>`}function incomingView(){let c=cards[incoming];if(!c)return;m.innerHTML=`<span class="ey">🤝 出会う</span><h1 class="title">この人の名刺</h1><p class="lead">NFCをタッチして名刺をひらきました。</p>${card(c)}<div class="panel"><h3>最近のチャレンジ</h3>${chall(c)}</div><button class="btn pink" data-a="receive" ${col.some(x=>x.id===c.id)?'disabled':''}>${col.some(x=>x.id===c.id)?'✓ もう名刺帳にあります':'🤝 この名刺をもらう'}</button>`}function confirmView(){let c=cards[incoming];m.innerHTML=`<div class="center"><div class="big">🤝</div><h1 class="title">${esc(c.name)}と<br>名刺交換しますか？</h1><p class="lead">この名刺はあなたの「子ども店長名刺帳」に入ります。</p></div><div class="note">リアルで会って名刺交換した出会いを残します。友だちの名刺帳からコピーはできません。</div><div class="actions"><button class="btn pink" data-a="ok">名刺をもらう</button><button class="btn soft" data-a="cancel">やめる</button></div>`}function success(){let c=cards[incoming],e=col.find(x=>x.id===c.id);m.innerHTML=`<div class="center"><div class="big">🎉</div><h1 class="title">名刺をもらった！</h1></div>${card(c)}<div class="panel"><p><b>${esc(e.met)}</b> に出会いました。<br>出会ったときのお店：<b>${esc(e.shop)}</b></p></div><div class="actions"><button class="btn blue" data-a="book">📖 名刺帳で見る</button><button class="btn soft" data-a="incoming">相手の名刺を見る</button></div>`}function book(){let list=col.map(e=>({e,c:cards[e.id]})).filter(x=>x.c);m.innerHTML=`${readonly?'<div class="readonly">👀 この名刺帳は「見るだけ」です。ここから名刺をもらうことはできません。</div>':''}<div class="booktop"><div><span class="ey">📖 出会いをのこす</span><h1 class="title">${readonly?'見せる名刺帳':'わたしの名刺帳'}</h1><p class="lead">${list.length}人の子ども店長と出会いました。</p></div><span class="count">${list.length}人</span></div>${list.length?`<div class="grid">${list.map(({e,c})=>`<button class="mini" data-detail="${c.id}"><div class="miniart">${c.emoji}</div><div class="minibody"><b>${esc(c.name)}</b><span>${esc(e.met)} に出会った</span><span>${esc(e.shop)}</span></div></button>`).join('')}</div>`:'<div class="panel"><p>まだ名刺はありません。リアルで会って名刺交換してみよう。</p></div>'}${readonly?'<div class="panel"><button class="btn soft" data-a="leave">わたしの画面にもどる</button></div>':'<div class="panel"><h3>👀 名刺帳を見せる</h3><p>「誰に会った？」を見せ合うための閲覧専用モードです。</p><button class="btn green" data-a="show">名刺帳を見せる</button></div>'}` }function detail(){let c=cards[selected],e=col.find(x=>x.id===selected);m.innerHTML=`${readonly?'<div class="readonly">👀 見るだけモード</div>':''}<span class="ey">🪪 出会った店長</span><h1 class="title">${esc(c.name)}</h1>${card(c)}<div class="panel"><p>出会った日：<b>${esc(e.met)}</b><br>そのときのお店：<b>${esc(e.shop)}</b></p></div><div class="panel"><h3>🌱 この店長のチャレンジ</h3>${chall(c)}</div>${readonly?'<div class="note">この名刺は見せてもらっているだけなので、あなたの名刺帳には追加できません。</div>':''}` }function render(){nav.hidden=readonly||!['home','book'].includes(screen);back.hidden=!readonly&&['home','book'].includes(screen);document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.nav===screen));({home,edit,addch,challenges,incoming:incomingView,confirm:confirmView,success,book,detail}[screen]||home)()}m.addEventListener('click',e=>{let a=e.target.closest('[data-a]')?.dataset.a,d=e.target.closest('[data-detail]')?.dataset.detail;if(d){selected=d;go('detail');return}if(!a)return;if(a==='edit')go('edit');if(a==='challenges')go('challenges');if(a==='addch')go('addch');if(a==='book'){readonly=false;go('book')}if(a==='demo'){incoming='yui';go('incoming')}if(a==='receive')go('confirm');if(a==='cancel')go('incoming');if(a==='ok'){let c=cards[incoming];if(!col.some(x=>x.id===c.id)){col.push({id:c.id,met:day(),shop:c.shop});save()}go('success')}if(a==='incoming')go('incoming');if(a==='show'){readonly=true;go('book')}if(a==='leave'){readonly=false;go('book')}});m.addEventListener('submit',e=>{e.preventDefault();let fd=new FormData(e.target);if(e.target.id==='ef'){owner.name=fd.get('name').trim();owner.shop=fd.get('shop').trim();owner.msg=fd.get('msg').trim();owner.tags=fd.get('tags').split(/[、,]/).map(x=>x.trim()).filter(Boolean).slice(0,5);save();go('home')}if(e.target.id==='cf'){owner.ch.unshift({d:day(),t:fd.get('t').trim(),f:fd.get('f').trim(),n:fd.get('n').trim()});save();go('challenges')}});m.addEventListener('change',e=>{if(e.target.id!=='img'||!e.target.files[0])return;let r=new FileReader;r.onload=()=>{owner.image=r.result;save();let p=document.getElementById('prev');p.textContent='';p.style.backgroundImage=`url('${owner.image}')`};r.readAsDataURL(e.target.files[0])});nav.addEventListener('click',e=>{let n=e.target.closest('[data-nav]')?.dataset.nav;if(n){readonly=false;go(n)}});back.onclick=()=>{if(readonly&&screen==='detail')return go('book');go({edit:'home',addch:'edit',challenges:'home',incoming:'home',confirm:'incoming',success:'book',detail:'book'}[screen]||'home')};document.getElementById('reset').onclick=()=>{if(confirm('デモをリセットしますか？')){localStorage.removeItem('kt_owner');localStorage.removeItem('kt_col');location.href=location.pathname}};let q=new URLSearchParams(location.search).get('card');if(q&&cards[q]){incoming=q;screen='incoming'}render();</script></body></html>
