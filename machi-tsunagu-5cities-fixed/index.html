<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>まちをつなぐ。5自治体比較版 修正版</title><style>html,body,#base{margin:0;width:100%;height:100%;border:0;display:block;overflow:hidden;background:#eef8f1}</style></head><body><iframe id="base" src="../machi-tsunagu-5cities/index.html"></iframe><script>
const D={
'南風原町':{pop:41330,childPct:19.4,childN:8011,social:412,out:67.6,biz:1441,emp:14829,start:{connection:50,youth:44,child:63,senior:51,stay:38,industry:57,tourism:38,equity:44,fatigue:32},strong:['子ども人口の存在感','医療・福祉や地域企業との連携余地','転入者との新しいつながり'],weak:['町外通勤・通学が多い','地区規模の差','人は多くても関係が薄くなりやすい']},
'与那原町':{pop:19920,childPct:17.7,childN:3517,social:120,out:58,biz:830,emp:6850,start:{connection:58,youth:48,child:58,senior:53,stay:52,industry:54,tourism:48,equity:61,fatigue:30},strong:['コンパクトで施策が届きやすい','海辺・商業・交流の組み合わせ','地区格差を抑えやすい'],weak:['にぎわいと暮らしの摩擦','産業の継続性','若者・子育て世帯への魅力づくり']},
'八重瀬町':{pop:33255,childPct:19.6,childN:6505,social:260,out:64,biz:980,emp:7800,start:{connection:49,youth:43,child:60,senior:48,stay:44,industry:51,tourism:42,equity:46,fatigue:33},strong:['子育て・暮らしの拠点づくり','農や地域資源の活用','分散型施策との相性'],weak:['住宅地化でつながりが薄まりやすい','町外へ出る人が多い','地区ごとに公平に届く仕組み']},
'南城市':{pop:46929,childPct:17.4,childN:8184,social:60,out:59,biz:1320,emp:9900,start:{connection:48,youth:42,child:55,senior:51,stay:47,industry:49,tourism:60,equity:40,fatigue:34},strong:['観光・文化・自然資源','地域文化と交流の相性','分散型・出張型施策の余地'],weak:['広い市域と移動課題','観光偏重による住民負担','中心と周辺の差']},
'西原町':{pop:35659,childPct:15.2,childN:5420,social:180,out:61,biz:1050,emp:8600,start:{connection:52,youth:54,child:58,senior:47,stay:46,industry:56,tourism:34,equity:52,fatigue:31},strong:['大学・学び・若者資源','若者施策や仕事体験との相性','企業や挑戦支援への展開'],weak:['若者が地域とつながっているとは限らない','高齢者や地区のつながりが置き去りになりやすい','学び資源を町全体へ還元する設計']}
};
const f=document.getElementById('base');
f.onload=()=>{const lw=f.contentWindow;const old=lw.patchFrame;if(typeof old!=='function')return;lw.patchFrame=function(){old.apply(this,arguments);setTimeout(()=>fix(lw),40)}};
function selected(lw){const b=lw.document.querySelector('.city.sel b');return b?b.textContent.trim():'南風原町'}
function fix(lw){const name=selected(lw),c=D[name],gf=lw.document.getElementById('game'),gw=gf&&gf.contentWindow,d=gw&&gw.document;if(!c||!gw||!d)return;
  Object.assign(gw.GAME_DATA.START,c.start);
  const title=d.querySelector('#setup h2');if(title)title.textContent='① '+name+'を、データから読む';
  const facts=d.querySelectorAll('.fact');const vals=[
    ['人口',c.pop.toLocaleString()+'人','2025年1月1日'],['0〜14歳',c.childPct+'%','2025年1月1日'],['0〜14歳人口',c.childN.toLocaleString()+'人','2025年1月1日'],
    ['若者の地域接点',c.start.youth,'ゲーム初期値'],['子ども・子育て',c.start.child,'ゲーム初期値'],['地域産業',c.start.industry,'ゲーム初期値'],
    ['強み',c.strong[0],'地域特性'],['課題',c.weak[0],'地域特性']];
  facts.forEach((el,i)=>{if(!vals[i])return;const a=el.querySelector('.small'),b=el.querySelector('b'),s=el.querySelector('.src');if(a)a.textContent=vals[i][0];if(b)b.textContent=vals[i][1];if(s)s.textContent=vals[i][2]});
  const source=d.querySelector('.sourceBox');if(source)source.innerHTML='<b>📌 データの扱い</b><div class="small">人口・0〜14歳割合・0〜14歳人口は、5自治体を比較しやすいよう2025年1月1日の住民基本台帳ベースで統一しています。0〜100の指標、社会増減・町外通勤通学・事業所等のゲーム内推計、政策効果は教育用モデルです。</div>';
  const traits=d.querySelectorAll('.traitGrid .trait');const tv=[['strength','💪 強み①',c.strong[0]],['strength','💪 強み②',c.strong[1]],['strength','💪 強み③',c.strong[2]],['challenge','⚠️ 課題①',c.weak[0]],['challenge','⚠️ 課題②',c.weak[1]],['challenge','⚠️ 課題③',c.weak[2]]];traits.forEach((el,i)=>{if(!tv[i])return;el.classList.remove('strength','challenge','mixed');el.classList.add(tv[i][0]);el.innerHTML='<b>'+tv[i][1]+'</b><div class="small">'+tv[i][2]+'</div><div class="rule">この地域特性が施策の効果適正度に影響します。</div>'});
  replaceNames(d,name);rewriteTown(gw,d,c);rewriteFinal(gw,d,c);
  const obs=new MutationObserver(()=>{replaceNames(d,name);rewriteTown(gw,d,c);rewriteFinal(gw,d,c)});obs.observe(d.body,{subtree:true,childList:true,characterData:true});
}
function replaceNames(d,name){const w=d.createTreeWalker(d.body,NodeFilter.SHOW_TEXT);let n;while(n=w.nextNode()){const p=n.parentElement;if(!p||['SCRIPT','STYLE'].includes(p.tagName))continue;if(n.nodeValue.includes('南風原町'))n.nodeValue=n.nodeValue.replaceAll('南風原町',name);if(n.nodeValue.includes('南風原補正'))n.nodeValue=n.nodeValue.replaceAll('南風原補正',name.replace(/[市町]$/,'')+'補正')}}
function model(c,s,y){const st=c.start,v=s.v;return{pop:Math.round(c.pop+y*22+(v.child-st.child)*10+(v.stay-st.stay)*8+(v.acceptance-56)*3-Math.max(0,v.fatigue-60)*2),child:Math.max(14,Math.min(24,+(c.childPct+(v.child-st.child)*.03+(v.acceptance-56)*.01-y*.02).toFixed(1))),social:Math.round(Math.max(-300,Math.min(900,c.social+(v.acceptance-56)*5+(v.child-st.child)*2+(v.industry-st.industry)*2-Math.max(0,v.fatigue-55)*2))),out:Math.max(38,Math.min(80,+(c.out-(v.stay-st.stay)*.30-(v.industry-st.industry)*.10+(v.fatigue>70?1.1:0)).toFixed(1))),biz:Math.round(Math.max(Math.round(c.biz*.85),c.biz+(v.industry-st.industry)*4.5+(v.tourism-st.tourism)*1.4-Math.max(0,v.fatigue-65)*1.3)),emp:Math.round(Math.max(Math.round(c.emp*.88),c.emp+(v.industry-st.industry)*42+(v.stay-st.stay)*28+(v.tourism-st.tourism)*10))}}
function rewriteTown(gw,d,c){const s=gw.MACHI_V9&&gw.MACHI_V9.getState&&gw.MACHI_V9.getState();const box=d.querySelector('#townSnapshot');if(!s||!box)return;const y=(s.history||[]).length,x=model(c,s,y),cells=box.querySelectorAll('.townStat');const vals=[['人口',x.pop.toLocaleString()+'人',y?'ゲーム内推計':'2025年1月1日'],['0〜14歳',x.child+'%',y?'ゲーム内推計':'2025年1月1日'],['社会増減',(x.social>0?'+':'')+x.social+'人/年','ゲーム内モデル'],['町外通勤・通学',x.out+'%','ゲーム内モデル'],['町内事業所',x.biz.toLocaleString(),'ゲーム内モデル'],['町内従業者',x.emp.toLocaleString()+'人','ゲーム内モデル']];cells.forEach((el,i)=>{if(!vals[i])return;const sp=el.querySelector('span'),b=el.querySelector('b'),sm=el.querySelector('small');if(sp)sp.textContent=vals[i][0];if(b)b.textContent=vals[i][1];if(sm)sm.textContent=vals[i][2]});const disc=box.querySelector('.townDisclaimer');if(disc)disc.textContent='人口と0〜14歳割合の出発点は2025年1月1日基準。その他の初期値と2年目以降の数値は教育用ゲームの仮想推計です。'}
function rewriteFinal(gw,d,c){const s=gw.MACHI_V9&&gw.MACHI_V9.getState&&gw.MACHI_V9.getState(),mini=d.querySelector('#finalTown .finalTownMini');if(!s||!mini)return;const x=model(c,s,(s.history||[]).length);mini.textContent='人口 '+x.pop.toLocaleString()+'人 ／ 社会増減 '+(x.social>0?'+':'')+x.social+'人/年 ／ 町外通勤・通学 '+x.out+'% ／ 事業所 '+x.biz.toLocaleString()}
</script></body></html>
