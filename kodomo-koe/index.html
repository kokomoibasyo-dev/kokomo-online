<!doctype html>
<html lang="ja">
<head>

  <title>こどもの声を聴くって？ ― さまざまな、声のカタチ ―</title>
  <style>
    :root{
      --navy:#17324d; --navy2:#244b70; --ink:#1f2933; --muted:#5d6772;
      --paper:#fbfaf6; --panel:#ffffff; --line:#d9dee3; --soft:#eef4f7;
      --accent:#d98f39; --green:#2f6d5a; --warn:#8a5c13; --danger:#8a3d3d;
      --radius:22px; --shadow:0 10px 35px rgba(23,50,77,.09);
    }
    *{box-sizing:border-box}
    html{background:var(--paper)} body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic","Noto Sans JP",sans-serif;color:var(--ink);background:linear-gradient(180deg,#f4f7f8 0,#fbfaf6 34%);min-height:100vh}
    button,input{font:inherit}
    button{cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
    .app{max-width:820px;margin:0 auto;padding:16px 16px calc(40px + env(safe-area-inset-bottom))}
    header{display:flex;justify-content:space-between;align-items:center;padding:8px 2px 14px}
    .brand{font-size:.82rem;font-weight:700;letter-spacing:.08em;color:var(--navy)}
    .mini-link{border:0;background:transparent;color:var(--navy2);font-size:.88rem;text-decoration:underline;text-underline-offset:3px}
    .card{background:var(--panel);border:1px solid rgba(23,50,77,.08);border-radius:var(--radius);box-shadow:var(--shadow);padding:26px}
    .hero{padding:36px 26px;text-align:center}
    .eyebrow{font-size:.8rem;letter-spacing:.13em;color:var(--green);font-weight:800;margin-bottom:12px}
    h1{font-size:clamp(2rem,7vw,3.3rem);line-height:1.2;margin:0;color:var(--navy);letter-spacing:.02em}
    .subtitle{font-size:clamp(1rem,3.4vw,1.25rem);font-weight:700;color:var(--navy2);margin:10px 0 0}
    .lead{font-size:1.08rem;line-height:1.9;margin:24px auto 0;max-width:620px}
    .meta{margin-top:18px;color:var(--muted);font-size:.88rem;display:flex;justify-content:center;gap:14px;flex-wrap:wrap}
    .primary,.secondary{border-radius:999px;padding:14px 24px;font-weight:800;border:0;min-height:50px}
    .primary{background:var(--navy);color:#fff;box-shadow:0 6px 18px rgba(23,50,77,.18)}
    .secondary{background:var(--soft);color:var(--navy);border:1px solid #cfdae1}
    .primary:disabled{opacity:.38;box-shadow:none;cursor:default}
    .actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:28px}
    h2{font-size:1.65rem;color:var(--navy);margin:0 0 16px;line-height:1.4}
    h3{font-size:1.1rem;color:var(--navy);margin:24px 0 8px}
    p{line-height:1.85}.note{background:var(--soft);border-left:5px solid var(--navy2);padding:16px 18px;border-radius:12px;line-height:1.8}
    .voice-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:18px 0}
    .voice-chip{background:#f7f3ea;border:1px solid #eadfca;border-radius:14px;padding:13px;text-align:center;font-weight:700}
    .emphasis{font-size:1.17rem;font-weight:800;color:var(--navy);line-height:1.7}
    .progress-wrap{margin-bottom:14px}.progress-head{display:flex;justify-content:space-between;gap:10px;color:var(--muted);font-size:.86rem;margin-bottom:7px}.progress{height:8px;background:#e8edf0;border-radius:999px;overflow:hidden}.progress>div{height:100%;background:var(--navy2);width:0;transition:width .25s ease}
    .scene-label{display:inline-block;background:#edf4f2;color:var(--green);border-radius:999px;padding:7px 12px;font-weight:800;font-size:.82rem;margin-bottom:13px}
    .scene{font-size:clamp(1.28rem,4vw,1.7rem);font-weight:800;line-height:1.65;margin:6px 0 20px;color:#182a3a}
    .prompt{font-weight:800;color:var(--navy);font-size:1.03rem;margin-bottom:10px}
    .choices{display:grid;gap:10px}.choice{width:100%;text-align:left;-webkit-appearance:none;appearance:none;padding:16px 17px;border-radius:15px;border:1px solid var(--line);background:#fff;color:var(--ink);line-height:1.55;transition:.15s}.choice.selected{border:2px solid var(--navy2);background:#eef5f8}.choice[disabled]{cursor:default;opacity:.76}
    @media (hover:hover) and (pointer:fine){
      .primary:hover{background:#10283d}
      .choice:hover{border-color:#99aebb;background:#fafcfd}
    }
    .choice-check{display:flex;gap:12px;align-items:flex-start}.choice-check input{margin-top:5px;transform:scale(1.2)}
    .insight{margin-top:18px;padding:18px;border-radius:16px;background:#f7f3ea;border:1px solid #eadfca}.insight strong{color:var(--navy)}
    .score{font-size:2rem;font-weight:900;color:var(--navy);margin:4px 0 6px}.mark{font-size:2.2rem;font-weight:900}.mark.good{color:var(--green)}.mark.mid{color:var(--warn)}.mark.try{color:var(--danger)}
    .results-grid{display:grid;gap:9px;margin:16px 0}.result-row{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:13px 15px;border:1px solid var(--line);border-radius:14px;background:#fff}.result-title{font-weight:700}.result-mark{font-size:1.5rem;font-weight:900}
    details{border:1px solid var(--line);border-radius:14px;padding:0 15px;background:#fff;margin:10px 0}summary{cursor:pointer;font-weight:800;padding:14px 0;color:var(--navy)}.detail-body{padding:0 0 16px;line-height:1.75}.tag{display:inline-block;font-size:.78rem;font-weight:800;background:#f0f4f6;padding:5px 9px;border-radius:999px;margin-right:5px;margin-bottom:5px}
    .source{font-size:.91rem;color:var(--muted);line-height:1.75}.source a{color:var(--navy2);word-break:break-all}.disclaimer{font-size:.86rem;color:var(--muted);border-top:1px solid var(--line);padding-top:14px;margin-top:18px}
    .footer-msg{text-align:center;padding:18px 5px}.footer-msg .big{font-size:1.28rem;font-weight:900;color:var(--navy)}
    .hidden{display:none!important}
    @media(max-width:560px){.card{padding:20px}.hero{padding:30px 20px}.voice-list{grid-template-columns:1fr 1fr}.scene{font-size:1.25rem}.app{padding:10px 10px 36px}}
  </style>
</head>
<body>
  <main class="app">
    <header>
      <div class="brand">ここも｜啓発コンテンツ</div>
      <div style="display:flex;gap:14px;align-items:center">
        <button class="mini-link" id="shareBtn" type="button">共有する</button>
        <button class="mini-link" id="refBtn" type="button">参考資料</button>
      </div>
    </header>
    <section id="screen" aria-live="polite"></section>
  </main>
<script>
const THEMES = [
  {id:'receive', title:'まず受け止める', result:'まず受け止める'},
  {id:'form', title:'まだ言葉になっていない気持ち', result:'気持ちを急いで決めない'},
  {id:'forms', title:'さまざまな声のカタチ', result:'言葉以外も手がかりにする'},
  {id:'privacy', title:'秘密と安全', result:'秘密と安全を一緒に考える'},
  {id:'expression', title:'どう伝えるかも選べる', result:'伝え方を本人と考える'},
  {id:'consider', title:'声を聴いた、そのあと', result:'希望の背景まで聴く'},
  {id:'feedback', title:'ちゃんと返す', result:'聴いたあとも確かめる'}
];

const BANK = {
receive:[
 {scene:'こどもが「明日、学校行きたくない」と言いました。', backgrounds:['学校で嫌なことがあったのかも','疲れていて休みたいのかも','理由は本人にもまだ分からないのかも','学校とは別のことで気持ちがいっぱいなのかも'], choices:[
  c('そうなんだね。今、話したい？ 今は話したくなければ、それでもいいよ',2,'気持ちをいったん受け止め、話すタイミングも本人に委ねています。'),
  c('何かあった？ 話せる範囲で聴いてもいい？',1,'聴こうとする姿勢があります。答えたくない余地も残せています。'),
  c('何があったの？ 理由をちゃんと教えて',0,'理由を急いで求めると、「説明しないといけない」と感じることもあります。'),
  c('とりあえず明日は行ってみたら？',-2,'解決を急ぐと、今の気持ちより登校を優先されたと受け取る可能性があります。')], point:'原因を当てる前に、その言葉をいったん受け止める。'},
 {scene:'こどもが「もう部活やめたい」と言いました。', backgrounds:['人間関係がつらいのかも','活動そのものが合わなくなったのかも','別にやりたいことができたのかも','今日はしんどくて強い言葉になったのかも'], choices:[
  c('そう思ってるんだね。よかったら、もう少し聴いてもいい？',2,'まず本人の言葉を受け止め、続きを話すかも本人に委ねています。'),
  c('何か嫌なことがあった？ 話せるところだけでも',1,'関心を示しつつ、話せる範囲を本人に委ねています。'),
  c('せっかくここまで続けたのにもったいないよ',0,'善意でも、大人の価値観が本人の話より先に出ています。'),
  c('途中で投げ出すのはよくないよ',-2,'理由を聴く前に評価すると、続きを話しにくくなる可能性があります。')], point:'「続けるべき」という価値判断より先に、その子の経験を聴く。'},
 {scene:'こどもが「今日の親戚の集まり、行きたくない」と言いました。', backgrounds:['苦手な人がいるのかも','人が多い場所がしんどいのかも','一人で過ごしたいのかも','うまく説明できない違和感があるのかも'], choices:[
  c('行きたくないんだね。今どんな感じなのか、聴いてもいい？',2,'本人の言葉を受け止めたうえで、聴いてよいか確認しています。'),
  c('今日はしんどい感じ？ 違ったら教えて',1,'仮説を置きつつ、違えば訂正できる余地を残しています。'),
  c('行けばきっと楽しいよ',0,'励ますつもりでも、今の気持ちを飛び越える可能性があります。'),
  c('みんな行くんだから行きなさい',-2,'本人の意見を表す余地を狭めています。')], point:'周囲の都合より先に、本人が何を感じているかを扱う。'},
 {scene:'こどもが「今日は友達と遊びたくない」と言いました。', backgrounds:['ケンカしたのかも','一人でいたいのかも','疲れているのかも','友達とは別のことが気になっているのかも'], choices:[
  c('今日は遊びたくないんだね',2,'解釈を足さず、本人の言葉をそのまま受け止めています。'),
  c('一人でいたい感じ？ 違ったら教えてね',1,'可能性を確認しつつ、訂正できる余地があります。'),
  c('ケンカしたの？',0,'理由を一つに絞る問いは、本人の考えを誘導することがあります。'),
  c('せっかく誘ってくれたんだから遊びなよ',-2,'本人の意思より周囲への配慮を優先しています。')], point:'「なぜ？」より前に、「そうなんだね」と受け取る。'}
],
form:[
 {scene:'こどもが「なんで嫌なのか、自分でも分からない」と言いました。', backgrounds:['いくつかの気持ちが混ざっているのかも','まだ言葉が見つからないのかも','話したくないことがあるのかも','本当に本人にもまだ分からないのかも'], choices:[
  c('分からないままでも大丈夫。よかったら一緒に整理してみる？',2,'「分からない」を認めたまま、考える支援を提案しています。'),
  c('どんな時に特に嫌になるか、思い出せそう？',1,'整理のきっかけになる問いです。無理に答えを求めないことも大切です。'),
  c('たぶん友達関係じゃない？',0,'大人の仮説に本人の考えが引っ張られる可能性があります。'),
  c('理由がないなら大丈夫なんじゃない？',-2,'まだ言葉になっていない感覚を否定する可能性があります。')], point:'「分からない」は、意見がないという意味ではない。'},
 {scene:'こどもが「部活を続けたいのか、やめたいのか分からない」と言いました。', backgrounds:['楽しい部分もあるのかも','つらい部分もあるのかも','周りをがっかりさせたくないのかも','どちらを選んだ後も不安なのかも'], choices:[
  c('続けたい気持ちと、やめたい気持ちの両方があるのかな。違ったら教えて',2,'揺れている状態をそのまま扱い、本人が訂正できる余地も残しています。'),
  c('続けた場合とやめた場合、一緒に考えてみる？',1,'選択肢を整理する支援になっています。'),
  c('もう少し続けてから決めたら？',0,'結論の方向を大人が先に設定しています。'),
  c('やめたいと思ったなら、やめればいいじゃん',-2,'本人が迷っているプロセスを飛ばしてしまいます。')], point:'迷っていること自体を大切な状態として扱う。'},
 {scene:'「休みの日、家族でどこへ行きたい？」と聞くと、こどもが「どこでもいい」と答えました。', backgrounds:['本当にどこでもいいのかも','選択肢が分からないのかも','自分の希望を言いにくいのかも','考える元気がないのかも'], choices:[
  c('今は特に決まってない？ いくつか見てから考えてみる？',2,'情報や選択肢を増やし、本人が考える余地をつくっています。'),
  c('海と映画ならどっちが近い？',1,'選びやすくする工夫ですが、選択肢を狭めすぎない配慮も必要です。'),
  c('じゃあ大人が決めるね',0,'本当に任せたい場合もありますが、まだ考える途中の可能性もあります。'),
  c('自分の希望くらいちゃんと言って',-2,'意見形成の難しさを本人の責任にしています。')], point:'意見を持ちやすくする情報や選択肢を用意することも支援。'},
 {scene:'昨日は「イベントに参加したい」と言っていたこどもが、今日は「やっぱり行きたくない」と言いました。', backgrounds:['気持ちが変わったのかも','新しい情報を知ったのかも','昨日は周囲に合わせていたのかも','当日が近づいて不安になったのかも'], choices:[
  c('気持ちが変わったんだね。今はどう思ってる？',2,'現在の意見を改めて聴こうとしています。'),
  c('昨日と今日で、何か変わったことある？',1,'変化を確認する問いです。答えを求めすぎないことも大切です。'),
  c('昨日は行くって言ったよね？',0,'一貫性を求める圧力として伝わる場合があります。'),
  c('一度決めたんだから行こう',-2,'意見を変える余地を奪っています。')], point:'意見は変わってよい。いまの本人の意見を確認する。'}
],
forms:[
 {scene:'話している途中で、こどもが急に黙って下を向きました。', backgrounds:['言葉を探しているのかも','話したくなくなったのかも','感情が大きくなったのかも','ただ少し考えているだけかも'], choices:[
  c('少し待つね。今は話さなくてもいいし、別の方法でも大丈夫だよ',2,'沈黙の意味を決めず、本人にペースと方法を戻しています。'),
  c('今、何か考えてる？',1,'確認しようとしています。無理に返答を求めないことも大切です。'),
  c('学校に行くのが怖いんだね',0,'表情や沈黙から意味を一つに決めています。'),
  c('黙ってたら分からないよ',-2,'言葉で説明できることだけを声として扱っています。')], point:'沈黙は手がかり。でも答えではない。'},
 {scene:'質問すると、こどもは話さずに選択カードを指さしました。', backgrounds:['話すより選ぶ方が楽なのかも','言葉が出にくいのかも','その選択が一番近いのかも','とりあえず今はそれを選んだだけかも'], choices:[
  c('これを選んだんだね。これで合ってる？',2,'その表現方法を尊重し、意味も本人に確認しています。'),
  c('指さして答える方がやりやすい？',1,'本人に合う方法を確認しています。'),
  c('どうしてそれなの？',0,'すぐに言葉での説明を求めています。'),
  c('ちゃんと口で言ってみよう',-2,'表現方法を一つに限定しています。')], point:'話す以外の方法も、本人が使える大切な表現手段。'},
 {scene:'こどもが紙に「イヤ」とだけ書きました。', backgrounds:['参加したくないのかも','何か一部分だけ嫌なのかも','それ以上はまだ書けないのかも','「イヤ」ということだけ伝えたいのかも'], choices:[
  c('「イヤ」なんだね。これを今伝えたいこととして受け取って大丈夫？',2,'今ある表現を尊重しつつ、意味を本人に確認しています。'),
  c('もう少し書きたくなったら書いてもいいよ',1,'表現を広げる余地を示しながら、強制していません。'),
  c('つまり参加したくないってこと？',0,'「イヤ」の意味を一つに決めています。'),
  c('イヤだけじゃ分からないよ',-2,'今出せた声を否定する可能性があります。')], point:'短い言葉にも意味がある。ただし意味は本人と確かめる。'},
 {scene:'話し合いの途中で、こどもが席を離れました。', backgrounds:['休みたいのかも','その場がしんどいのかも','話は続けたいけど今は無理なのかも','別の理由で席を立っただけかも'], choices:[
  c('少し待って、戻ってきたら「続ける？ 休む？ 今日は終わる？」と確認する',2,'行動を手がかりにしつつ、その意味は本人に確認しています。'),
  c('少し休憩しようか？',1,'安心を優先する提案です。本人の意向も確認できるとさらに丁寧です。'),
  c('もう話したくないんだな、と判断して終了する',0,'行動の意味を大人が決めています。'),
  c('まだ終わってないから戻ってきて',-2,'本人のペースを奪う可能性があります。')], point:'行動の意味を決めず、本人が選べる形で確かめる。'}
],
privacy:[
 {scene:'こどもが「この話、先生には言わないで」と言いました。', backgrounds:['先生に知られるのが怖いのかも','自分で伝えたいのかも','まだ伝えるか決めていないのかも','ただ今は話を聴いてほしいのかも'], choices:[
  c('分かった。誰に何を伝えていいか一緒に確認しよう。ただ、安全に関わる場合は他の人に相談することもあるよ',2,'本人の希望を尊重しつつ、安全上の例外についても隠さず説明しています。'),
  c('今のところ、先生には伝えないでおこう',1,'本人の希望を尊重しています。安全上の例外も説明できるとより丁寧です。'),
  c('絶対に誰にも言わない',0,'安心させたい言葉でも、安全上守れない約束になる場合があります。'),
  c('先生に言わないと解決しないから話すね',-2,'本人の意向を飛ばして進めています。')], point:'守秘と安全の両方を、本人と確認しながら扱う。'},
 {scene:'こどもが「このこと、お母さんには知られたくない」と言いました。', backgrounds:['怒られるのが怖いのかも','心配させたくないのかも','自分で整理してから話したいのかも','家庭との関係とは別の理由があるのかも'], choices:[
  c('分かった。誰に、どこまでなら話していいか確認しよう',2,'情報の扱いを本人と一緒に決めています。'),
  c('今は伝えたくないんだね',1,'本人の希望をいったん受け止めています。'),
  c('お母さんなら分かってくれると思うよ',0,'大人の予想を本人の不安より先に置いています。'),
  c('親なんだから伝えるよ',-2,'本人の意見や守秘を大きく狭めています。')], point:'「誰に・何を」伝えるかも、本人と確認する。'},
 {scene:'こどもが「家に帰るのが怖い。でも誰にも言わないで」と言いました。', backgrounds:['助けてほしい気持ちもあるのかも','他人に知られる方が怖いのかも','今後どうなるか分からず不安なのかも','話したことを後悔しているのかも'], choices:[
  c('話してくれてありがとう。安全を守るために他の大人にも相談する必要があるかもしれない。何をどうするか、できるだけ一緒に確認しよう',2,'安全確保を優先しつつ、本人を置き去りにしない関わりです。'),

function c(text,score,feedback){return {text,score,feedback}}
function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
// 内部値は画面には表示せず、◎○△の3段階に変換するためだけに使用
function markFor(score){return score===2?'◎':score===-2?'△':'○'}
function markClass(mark){return mark==='◎'?'good':mark==='△'?'try':'mid'}

async function shareApp(){
  const shareData={
    title:'こどもの声を聴くって？ ― さまざまな、声のカタチ ―',
    text:'こどもの言葉や態度の背景を考えながら、「あなたならどう返す？」を体験する啓発コンテンツです。',
    url:'https://kokomoibasyo-dev.github.io/kokomo-online/kodomo-koe/'
  };
  try{
    if(navigator.share){
      await navigator.share(shareData);
      return;
    }
    if(navigator.clipboard){
      await navigator.clipboard.writeText(shareData.url);
      alert('共有用URLをコピーしました');
      return;
    }
    prompt('このURLをコピーして共有してください',shareData.url);
  }catch(e){
    // ユーザーが共有シートを閉じた場合などは何もしない
  }
}

function startGame(){
 state.questions=THEMES.map(t=>({theme:t,q:BANK[t.id][Math.floor(Math.random()*BANK[t.id].length)]}));

}

 setHTML(`<div class="progress-wrap"><div class="progress-head"><span>${state.idx+1} / 7</span><span>${item.theme.title}</span></div><div class="progress"><div style="width:${pct}%"></div></div></div>

   state.selectedBg=new Set(checked);renderBackgroundInsight();
 };
}

function renderBackgroundInsight(){
 const item=state.questions[state.idx];
 state.pendingReply=null;
 setHTML(`<div class="progress-wrap"><div class="progress-head"><span>${state.idx+1} / 7</span><span>${item.theme.title}</span></div><div class="progress"><div style="width:${((state.idx+.3)/7)*100}%"></div></div></div>
 <div class="card">
  <div class="scene-label">${item.theme.title}</div><div class="scene">${item.q.scene}</div>
  <div class="insight"><strong>どれも「可能性」ではあります。でも、どれも同じくらいあり得るわけではありません。</strong>
  <p>目の前のこの子なら、どれが近そうだろう。普段の様子、その子らしさ、直近の出来事、これから起こる予定、人との関係、その場の環境などをつなげて考えると、可能性の見え方は変わります。</p>
  <p><strong>点ではなく、時間の流れを「線」で、関係や環境を「面」でみる。</strong><br>
  そのうえで、大人だけで答えを決めず、本人と確かめていくことが大切です。</p></div>
  <h3>では、あなたならなんて返す？</h3>
  <div class="choices" id="replyChoices">${shuffle(item.q.choices).map((x,i)=>`<button class="choice" type="button" data-text="${escapeAttr(x.text)}">${x.text}</button>`).join('')}</div>
  <div class="actions"><button class="primary" id="replyNext" type="button" disabled>進む</button></div>
 </div>`);
 const buttons=[...document.querySelectorAll('#replyChoices .choice')];
 const next=document.getElementById('replyNext');
 buttons.forEach(btn=>btn.onclick=()=>{
   buttons.forEach(b=>b.classList.remove('selected'));
   btn.classList.add('selected');
   btn.blur();
   state.pendingReply=btn.dataset.text;
   next.disabled=false;
 });
 next.onclick=()=>{ if(state.pendingReply) chooseReply(state.pendingReply); };
}

function chooseReply(text){
 const item=state.questions[state.idx];const ans=item.q.choices.find(x=>x.text===text);const mark=markFor(ans.score);
 state.results.push({theme:item.theme,q:item.q,selectedBg:[...state.selectedBg],answer:ans,mark});
 setHTML(`<div class="progress-wrap"><div class="progress-head"><span>${state.idx+1} / 7</span><span>${item.theme.title}</span></div><div class="progress"><div style="width:${((state.idx+.7)/7)*100}%"></div></div></div>
 <div class="card">
  <div class="scene-label">${item.theme.title}</div>
  <div class="mark ${markClass(mark)}">${mark}</div>
  <p><strong>あなたの返し：</strong><br>${ans.text}</p>
  <div class="insight"><strong>振り返り</strong><p>${ans.feedback}</p><strong>ポイント</strong><p>${item.q.point}</p></div>
  <div class="actions"><button class="primary" id="nextQ">${state.idx===6?'結果を見る':'次の場面へ'}</button></div>
 </div>`);
 document.getElementById('nextQ').onclick=()=>{state.idx++;state.selectedBg=new Set();state.pendingReply=null;if(state.idx>=7)renderResults();else renderQuestion()};
}

  </div>
  <div class="results-grid">${state.results.map(r=>`<div class="result-row"><div class="result-title">${r.theme.result}</div><div class="result-mark ${markClass(r.mark)}">${r.mark}</div></div>`).join('')}</div>
  <div class="actions"><button class="primary" id="detailsBtn">7場面をくわしく振り返る</button><button class="secondary" id="finalBtn">最後のメッセージへ</button></div>
 </div>`);
 document.getElementById('detailsBtn').onclick=renderDetails;document.getElementById('finalBtn').onclick=renderClosing;
}

function renderDetails(){
 setHTML(`<div class="card"><div class="eyebrow">くわしく振り返る</div><h2>あなたが想像した背景と、選んだ返し方</h2>
 ${state.results.map((r,i)=>`<details ${i===0?'open':''}><summary>${i+1}. ${r.theme.result}　<span class="result-mark ${markClass(r.mark)}">${r.mark}</span></summary><div class="detail-body">
  <p><strong>場面</strong><br>${r.q.scene}</p>
  <p><strong>あなたが「あり得る」と考えた背景</strong><br>${r.selectedBg.length?r.selectedBg.map(x=>`<span class="tag">${x}</span>`).join(''):'<span class="tag">選択なし</span>'}</p>
  <p><strong>ほかにもあり得た背景</strong><br>${r.q.backgrounds.map(x=>`<span class="tag">${x}</span>`).join('')}</p>
  <p><strong>あなたの返し</strong><br>${r.answer.text}</p>
  <p><strong>振り返り</strong><br>${r.answer.feedback}</p>
  <p><strong>ポイント</strong><br>${r.q.point}</p>
 </div></details>`).join('')}
 <div class="actions"><button class="primary" id="toClose">最後のメッセージへ</button><button class="secondary" id="backResults">結果一覧へ</button></div></div>`);
 document.getElementById('toClose').onclick=renderClosing;document.getElementById('backResults').onclick=renderResults;
}

function renderClosing(){setHTML(`<div class="card hero">
 <div class="eyebrow">おわりに</div><h2>こどもの声は、いつも言葉になっているとは限りません。</h2>
 <div class="voice-list"><div class="voice-chip">話す</div><div class="voice-chip">書く</div><div class="voice-chip">選ぶ</div><div class="voice-chip">表情・行動</div></div>
 <p class="lead">ときには、まだ本人にも分からない。</p>
 <p class="emphasis">大切なのは、その意味を大人が決めることではなく、<br>目の前の「点」だけでなく、その子の時間の流れや関係・環境まで見ながら、<br>「どういうことだろう？」と考え、本人と確かめていくこと。</p>
 <p class="lead">そこから、こどもの声を聴くことが始まります。</p>
 <div class="actions"><button class="primary" id="shareEnd">このアプリを共有する</button><button class="secondary" id="againBtn">もう一度やってみる</button><button class="secondary" id="refs2">参考資料を見る</button></div>
 <div class="footer-msg"><div class="big">こどもの声を聴くって？</div><div>― さまざまな、声のカタチ ―</div><div style="margin-top:12px;font-weight:800">ここも</div></div>
 </div>`);document.getElementById('shareEnd').onclick=shareApp;document.getElementById('againBtn').onclick=startGame;document.getElementById('refs2').onclick=renderReferences;}

 <div class="source">
  <h3>こども家庭庁「第2版 こども・若者の意見の政策反映に向けたガイドライン」</h3>
  <p>こどもの「意見」を、主張や考えだけでなく、思い、気持ち、希望、その人なりのものの見方・感じ方を含むものとして捉え、意見を聴く際の環境づくり、意見形成支援、フィードバック等を整理しています。</p>
  <p><a href="https://www.cfa.go.jp/policies/iken/ikenhanei-guideline" target="_blank" rel="noopener">こども家庭庁 公式ページ</a></p>
  <p><a href="https://www.cfa.go.jp/assets/contents/node/basic_page/field_ref_resources/98ade0f0-d9dd-43a9-b6c9-7400316f4167/8d456f40/20260603_policies_iken_ikenhanei-guideline_08.pdf" target="_blank" rel="noopener">第2版ガイドライン PDF</a></p>
  <h3>こども家庭庁「意見表明等支援員の養成のためのガイドライン」等</h3>
  <p>意見形成支援、意見表明支援、こども中心、守秘、本人への確認、表明方法の選択、フィードバックなどの考え方を参考にしています。</p>
  <p><a href="https://www.cfa.go.jp/policies/jidougyakutai/Revised-Child-Welfare-Act" target="_blank" rel="noopener">こども家庭庁 関連資料ページ</a></p>
 </div>
 <div class="note"><strong>大切な注記</strong><br>本アプリの設問・選択肢・◎○△評価は、こども家庭庁の公式設問や公式評価ではありません。公式資料の内容を参考に、任意団体「ここも」が普及啓発用に構成したものです。</div>
 <div class="actions"><button class="primary" id="refBack">トップへ戻る</button></div></div>`);document.getElementById('refBack').onclick=renderHome;}

function escapeAttr(s){return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
renderHome();
</script>
