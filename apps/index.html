  <style>
    :root {
      --bg:#f4efdf; --paper:#fffdf7; --ink:#26362e; --muted:#6a756f;
      --line:#dedbcf; --green:#168329; --navy:#0d477f; --orange:#f18b16;
      --shadow:0 12px 34px rgba(46,55,43,.09);
    }
    *{box-sizing:border-box}
    body{
      margin:0; color:var(--ink);
      background:
        radial-gradient(circle at 10% 5%,rgba(71,150,80,.09),transparent 24rem),
        radial-gradient(circle at 92% 15%,rgba(241,139,22,.09),transparent 20rem),
        var(--bg);
      font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic","Noto Sans JP",system-ui,sans-serif;
      line-height:1.7;
    }
    .wrap{width:min(1120px,calc(100% - 32px));margin:auto}
    header{padding:38px 0 26px}
    .official-logo{width:min(180px,48vw);height:auto;display:block;border-radius:999px;overflow:hidden;box-shadow:0 8px 24px rgba(46,55,43,.08)}
    .eyebrow{margin-top:28px;color:var(--green);font-size:.78rem;font-weight:800;letter-spacing:.14em}
    h1{margin:10px 0 9px;font-size:clamp(2.15rem,7vw,4.7rem);line-height:1.08;letter-spacing:-.045em}
    .lead{margin:0;max-width:720px;color:var(--muted);font-size:clamp(1rem,2.4vw,1.17rem)}
    .mini{margin-top:17px;display:flex;gap:8px;flex-wrap:wrap}
    .pill,.kind{
      border:1px solid var(--line);background:rgba(255,253,247,.72);color:var(--muted);
      padding:6px 11px;border-radius:999px;font-size:.82rem;
    }
    main{padding:14px 0 72px}
    .toolbar{display:flex;gap:9px;flex-wrap:wrap;margin:14px 0 20px}
    .filter{
      appearance:none;border:1px solid var(--line);background:var(--paper);color:var(--ink);
      padding:8px 13px;border-radius:999px;font:inherit;font-size:.88rem;cursor:pointer;
    }
    .filter[aria-pressed="true"]{background:var(--green);color:white;border-color:var(--green)}
    .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
    .card{
      position:relative;min-height:310px;border:1px solid rgba(81,92,83,.16);border-radius:27px;
      background:rgba(255,253,247,.89);box-shadow:var(--shadow);padding:25px;text-decoration:none;color:inherit;
      display:flex;flex-direction:column;overflow:hidden;transition:.18s ease;
    }
    .card:hover{transform:translateY(-4px);box-shadow:0 18px 44px rgba(46,55,43,.14)}
    .card.featured{grid-column:span 2;min-height:320px;background:linear-gradient(120deg,rgba(255,253,247,.97),rgba(239,247,238,.9))}
    .topline{display:flex;align-items:flex-start;justify-content:space-between;gap:15px;margin-bottom:20px}
    .app-icon{
      width:92px;height:92px;border-radius:23px;background:rgba(255,255,255,.72);
      display:grid;place-items:center;border:1px solid rgba(50,67,57,.08);overflow:hidden;
    }
    .app-icon img{width:88%;height:88%;object-fit:contain;display:block}
    .app-icon .emoji{font-size:48px;line-height:1}
    h2{margin:0 0 8px;font-size:clamp(1.35rem,3vw,1.75rem);line-height:1.35;letter-spacing:-.02em}
    .card p{margin:0;color:var(--muted);max-width:780px;font-size:.98rem}
    .go{margin-top:auto;padding-top:23px;display:flex;align-items:center;gap:8px;color:var(--green);font-weight:800}
    .arrow{transition:.18s ease} .card:hover .arrow{transform:translateX(4px)}
    .empty{display:none;padding:40px 0;color:var(--muted)}
    footer{border-top:1px solid rgba(81,92,83,.15);padding:25px 0 40px;color:var(--muted);font-size:.88rem}
    .footer-inner{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap}
    .footer-name{font-weight:800;color:var(--green)}
    @media(max-width:760px){
      header{padding-top:26px}
      .official-logo{width:min(150px,42vw);border-radius:999px}
      .grid{grid-template-columns:1fr}
      .card,.card.featured{grid-column:span 1;min-height:285px;padding:21px}
      .app-icon{width:82px;height:82px;border-radius:21px}
    }
    @media(prefers-reduced-motion:reduce){*{transition:none!important}}
  </style>
</head>

  if (app.icon) {
    return `<img src="${esc(app.icon)}" alt="" loading="lazy">`;
  }
  return `<span class="emoji" aria-hidden="true">${esc(app.emoji || "🧩")}</span>`;
}

function cardMarkup(app) {
  return `
    <a class="card ${app.featured ? "featured" : ""}" href="${esc(app.url)}" target="_blank" rel="noopener" data-category="${esc(app.category)}">
      <div class="topline">
        <div class="app-icon">${iconMarkup(app)}</div>
        <span class="kind">${esc(app.kind)}</span>
      </div>
      <h2>${esc(app.title)}</h2>
      <p>${esc(app.description)}</p>
      <div class="go">${esc(app.cta || "ひらく")} <span class="arrow">→</span></div>
    </a>`;
}

function renderApps(category = "すべて") {
  const apps = category === "すべて"
    ? APP_LIST
    : APP_LIST.filter(app => app.category === category);

  grid.innerHTML = apps.map(cardMarkup).join("");
  empty.style.display = apps.length ? "none" : "block";
}

function renderFilters() {
  const categories = ["すべて", ...new Set(APP_LIST.map(app => app.category))];
  filters.innerHTML = categories.map((cat, i) =>
    `<button class="filter" type="button" data-filter="${esc(cat)}" aria-pressed="${i===0}">${esc(cat)}</button>`
  ).join("");

  filters.addEventListener("click", e => {
    const btn = e.target.closest(".filter");
    if (!btn) return;
    filters.querySelectorAll(".filter").forEach(b => b.setAttribute("aria-pressed","false"));
    btn.setAttribute("aria-pressed","true");
    renderApps(btn.dataset.filter);
  });
}

renderFilters();
renderApps();
</script>
</body>
</html>
