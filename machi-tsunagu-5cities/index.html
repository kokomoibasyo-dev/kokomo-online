haebaru:{n:'南風原町',g:'m',tag:'人が集まる。でも町外へ出ていくまち',sub:'子ども・福祉・企業基盤はある。課題は町外通勤通学と地区差。',v:'人が集まり、子育てや暮らしの土台もあります。ただ、町外へ出る人が多く、同じ町に住んでいても生活のリズムがばらばらです。便利さと、つながりの薄さ。その両方を見てください。',s:['子ども人口の存在感','医療・福祉や地域企業との連携余地','転入者との新しいつながり'],w:['町外通勤・通学が多い','地区規模の差','人は多くても関係が薄くなりやすい'],start:{connection:50,youth:44,child:63,senior:51,stay:38,industry:57,tourism:38,equity:44,fatigue:32},mul:{child:1,day:1,flex:1,jobs:1,biz:1,dist:1,tour:1}},
yonabaru:{n:'与那原町',g:'f',tag:'コンパクトさを活かしやすいまち',sub:'海と商業、移動のしやすさが強み。にぎわいと暮らしの両立がテーマ。',v:'規模が小さいぶん動きやすく、海や商業の資源もあります。でも、人が来ることと住み続けやすいことは別です。にぎわいをつくるなら暮らしとの折り合いも見てください。',s:['コンパクトで施策が届きやすい','海辺・商業・交流の組み合わせ','地区格差を抑えやすい'],w:['にぎわいと暮らしの摩擦','産業の継続性','若者・子育て世帯への魅力づくり'],start:{connection:58,youth:48,child:58,senior:53,stay:52,industry:54,tourism:48,equity:61,fatigue:30},mul:{child:.95,day:1.1,flex:.95,jobs:.95,biz:1.08,dist:.9,tour:1.18}},
yaese:{n:'八重瀬町',g:'m',tag:'成長と地域性の両立を考えるまち',sub:'住宅地化が進みつつ、農や地域性も残る。広がる町をどうつなぐか。',v:'子育て世帯も増え、暮らしやすさを求めて人が入ってきます。でも、広がるだけでは町にはなりません。顔の見える関係と地区をまたぐつながり、その両方を育ててください。',s:['子育て・暮らしの拠点づくり','農や地域資源の活用','分散型施策との相性'],w:['住宅地化でつながりが薄まりやすい','町外へ出る人が多い','地区ごとに公平に届く仕組み'],start:{connection:49,youth:43,child:60,senior:48,stay:44,industry:51,tourism:42,equity:46,fatigue:33},mul:{child:1.05,day:.95,flex:1,jobs:1,biz:.95,dist:1.12,tour:1}},
nanjo:{n:'南城市',g:'f',tag:'資源は豊か。でも距離があるまち',sub:'観光・文化・自然の強みが大きい一方、広い市域と移動が課題。',v:'外から見れば魅力がたくさんあります。でも、広い地域のどこに住んでいても恩恵を感じられるかは別問題です。観光や交流を伸ばすなら暮らしの足元も同時に見てください。',s:['観光・文化・自然資源','地域文化と交流の相性','分散型・出張型施策の余地'],w:['広い市域と移動課題','観光偏重による住民負担','中心と周辺の差'],start:{connection:48,youth:42,child:55,senior:51,stay:47,industry:49,tourism:60,equity:40,fatigue:34},mul:{child:.9,day:1.05,flex:1,jobs:.95,biz:.95,dist:1.16,tour:1.25}},
nishihara:{n:'西原町',g:'m',tag:'若者はいる。地域との接点が鍵のまち',sub:'大学や若い世代の資源がある。課題は「いる若者」と地域をどう結ぶか。',v:'若い人の資源があります。でも、そこに若者がいるだけでは地域は元気になりません。若者が地域の役割や仕事と結びつくのか、単に通り過ぎるのか。その分かれ目を見てください。',s:['大学・学び・若者資源','若者施策や仕事体験との相性','企業や挑戦支援への展開'],w:['若者が地域とつながっているとは限らない','高齢者や地区のつながりが置き去りになりやすい','学び資源を町全体へ還元する設計'],start:{connection:52,youth:54,child:58,senior:47,stay:46,industry:56,tourism:34,equity:52,fatigue:31},mul:{child:.95,day:1.05,flex:1.12,jobs:1.12,biz:1.08,dist:.95,tour:.9}}
};
let cur='haebaru';const $=x=>document.getElementById(x);function draw(){$('cities').innerHTML=Object.entries(C).map(([k,c])=>`<div class="city ${k===cur?'sel':''}" data-k="${k}"><img src="${c.g==='f'?IM.fi:IM.mi}"><b>${c.n}</b><div class="small">${c.tag}<br>${c.sub}</div><div style="clear:both"></div></div>`).join('');document.querySelectorAll('.city').forEach(x=>x.onclick=()=>{cur=x.dataset.k;draw();showVoice();})}function showVoice(){let c=C[cur];$('mTitle').textContent=c.n+'｜'+c.tag;$('mImg').src=c.g==='f'?IM.fp:IM.mp;$('mSpeech').textContent=c.v;$('mStrong').innerHTML=c.s.map(x=>'<li>'+x+'</li>').join('');$('mWeak').innerHTML=c.w.map(x=>'<li>'+x+'</li>').join('');$('fabImg').src=c.g==='f'?IM.fi:IM.mi;$('overlay').style.display='flex'}function close(){$('overlay').style.display='none'}$('voiceBtn').onclick=showVoice;$('mayorFab').onclick=showVoice;$('close').onclick=close;$('overlay').onclick=e=>{if(e.target===$('overlay'))close()};$('backFab').onclick=()=>location.reload();
function patchFrame(){let f=$('game'),w=f.contentWindow,d=w.document,c=C[cur];if(!w.GAME_DATA)return;Object.assign(w.GAME_DATA.START,c.start);let ps=w.GAME_DATA.POLICIES;ps.forEach(p=>{let m=1;if(p.tags.includes('child'))m*=c.mul.child;if(p.tags.includes('daytime'))m*=c.mul.day;if(p.tags.includes('flexible'))m*=c.mul.flex;if(p.tags.includes('jobs'))m*=c.mul.jobs;if(p.tags.includes('business'))m*=c.mul.biz;if(p.tags.includes('distributed'))m*=c.mul.dist;if(p.tags.includes('tourism'))m*=c.mul.tour;Object.keys(p.e).forEach(k=>{if(k!=='fatigue')p.e[k]=Math.round(p.e[k]*m)});if(p.id==='centralHub')p.name=c.n.replace(/[市町]$/,'')+'の中心拠点へ集中投資';});let hero=d.querySelector('.eyebrow');if(hero)hero.textContent='地域データ × まちづくりシミュレーション｜'+c.n+'比較版';let lead=d.querySelector('.lead');if(lead)lead.textContent=c.sub;let h=d.querySelector('#setup h2');if(h)h.textContent='① '+c.n+'を、データから読む';d.querySelectorAll('.pill').forEach(p=>{if(p.textContent.includes('南風原町'))p.textContent='🏘️ '+c.n});let fact=d.querySelectorAll('.fact');if(fact.length){let vals=[['人口','比較用モデル'],['0〜14歳','比較用モデル'],['社会増減','比較用モデル'],['町外通勤・通学','比較用モデル'],['町内事業所','比較用モデル'],['地域資源','比較用モデル'],['強み',c.s[0]],['課題',c.w[0]]];fact.forEach((el,i)=>{if(vals[i]){el.querySelector('.small').textContent=vals[i][0];el.querySelector('b').textContent=i===6?c.s[0]:i===7?c.w[0]:'自治体別';let s=el.querySelector('.src');if(s)s.textContent=vals[i][1]}})}let obs=new MutationObserver(()=>{d.querySelectorAll('.pill').forEach(p=>{if(p.textContent.includes('南風原町'))p.textContent='🏘️ '+c.n})});obs.observe(d.body,{subtree:true,childList:true});}
$('start').onclick=()=>{$('launcher').style.display='none';$('game').style.display='block';$('backFab').style.display='block';$('mayorFab').style.display='flex';$('game').src='../machi-tsunagu-v12/index.html';$('game').onload=()=>setTimeout(patchFrame,100);};draw();
