<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>みんなのまちづくり｜まちをつなぐ。</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;--ink:#26342d;--muted:#6e776f;--line:#d9e4da;--green:#397a58;--soft:#f3f8f4;--yellow:#fff4c9;--shadow:0 10px 28px rgba(35,70,48,.08)}*{box-sizing:border-box}html,body{margin:0;background:linear-gradient(180deg,#eef8f1,#fffdf8 34%,#fff7df);color:var(--ink)}body{min-height:100vh}.wrap{max-width:1080px;margin:auto;padding:14px 14px 80px}.hero,.panel,.card{background:#fff;border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow)}.hero{padding:22px;background:linear-gradient(135deg,#e9faee,#fff0bd)}.eyebrow{font-size:12px;font-weight:900;letter-spacing:.06em;color:#46604f}.hero h1{font-size:clamp(34px,8vw,56px);margin:5px 0}.lead{line-height:1.8;margin:0}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.btn{display:flex;align-items:center;justify-content:center;border:0;border-radius:14px;padding:13px 15px;background:#26362d;color:#fff;font-weight:900;text-decoration:none;cursor:pointer}.btn.secondary{background:#fff;color:#26362d;border:1px solid #ccd8cf}.panel{padding:16px;margin-top:12px}.filterGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.filter label{font-size:12px;font-weight:900;display:block;margin-bottom:5px}.filter select{width:100%;border:1px solid #cfdad1;border-radius:12px;background:#fff;padding:11px;font:inherit}.note{padding:11px 12px;border-radius:13px;background:var(--yellow);border:1px solid #eadc9c;font-size:12px;line-height:1.65;margin-top:10px}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:10px}.meta{font-size:12px;color:var(--muted)}.refresh{border:1px solid #ced9d0;background:#fff;border-radius:999px;padding:9px 12px;font-weight:800;cursor:pointer}.groups{margin-top:12px}.group{margin-top:18px}.groupHead{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin-bottom:8px;padding:0 3px}.groupHead h2{font-size:20px;margin:0}.groupCount{font-size:11px;color:var(--muted)}.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.card{padding:15px}.cardTop{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}.handle{font-size:20px;font-weight:950;overflow-wrap:anywhere}.order{font-size:11px;font-weight:900;background:#eef7f0;color:#286543;padding:5px 8px;border-radius:999px;white-space:nowrap}.achievement{font-size:42px;font-weight:950;line-height:1;margin:10px 0 5px}.achievement small{font-size:14px;color:var(--muted)}.endingLabel{font-size:12px;font-weight:800;color:#4e5d53}.phrase{margin-top:10px;padding:11px;border-radius:13px;background:#f7faf7;border:1px solid #e0e8e1;line-height:1.55}.quote{margin-top:10px;padding:12px;border-radius:14px;background:#fff8db;border:1px solid #eddda1;line-height:1.65;font-weight:700}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:10px}.metric{background:#f6f8f5;border-radius:11px;padding:8px;text-align:center}.metric span{display:block;font-size:10px;color:var(--muted)}.metric b{font-size:18px}.detail{margin-top:10px;border:1px solid #dce5dd;border-radius:14px;overflow:hidden}.detail summary{cursor:pointer;padding:11px 12px;font-weight:900;background:#f8faf8}.detailBody{padding:12px}.year{border-left:3px solid #74aa87;padding:3px 0 12px 12px;margin-bottom:12px}.year:last-child{margin-bottom:0}.yearTitle{font-weight:950}.tiny{font-size:11px;color:var(--muted);line-height:1.55}.chips{display:flex;flex-wrap:wrap;gap:5px;margin:6px 0}.chip{font-size:10px;padding:4px 7px;border-radius:999px;background:#eef2ef}.decision{margin-top:7px;font-size:13px;line-height:1.65}.decision b{color:#385945;display:block}.reflection{display:grid;gap:8px}.reflectItem{padding:9px 10px;background:#f7f8f5;border-radius:11px;line-height:1.65;font-size:13px}.reflectItem b{display:block;margin-bottom:2px}.empty,.error{padding:28px;text-align:center;line-height:1.8}.error{background:#fff1ed;border-color:#e9b8ae}.skeleton{height:300px;border-radius:18px;background:linear-gradient(90deg,#eef2ed 25%,#fafcf9 50%,#eef2ed 75%);background-size:200% 100%;animation:sh 1.2s infinite}@keyframes sh{to{background-position:-200% 0}}footer{text-align:center;color:#777f78;font-size:11px;line-height:1.7;margin-top:20px}@media(max-width:760px){.cards,.filterGrid,.actions{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(3,1fr)}.wrap{padding:10px 10px 70px}.hero,.panel,.card{padding:14px}}
</style>
</head>
<body>
<div class="wrap">
<section class="hero"><div class="eyebrow">「結果」より「どう考えたか」を読む</div><h1>みんなのまちづくり</h1><p class="lead">同じ自治体、同じ年数、同じ目標でも、選ぶ施策や迷い方は人によって違います。達成度だけでなく、毎年の「なぜこの判断をしたか」を見比べてみよう。</p><div class="actions"><a class="btn" href="./index.html">🌱 自分でもまちづくりする</a><button class="btn secondary" id="resetFilters" type="button">↺ 絞り込みを戻す</button></div></section>
<section class="panel"><div class="filterGrid"><div class="filter"><label for="cityFilter">自治体</label><select id="cityFilter"><option value="">すべての自治体</option></select></div><div class="filter"><label for="durationFilter">プレイ年数</label><select id="durationFilter"><option value="">すべての年数</option></select></div><div class="filter"><label for="goalFilter">目指すまち</label><select id="goalFilter"><option value="">すべての目標</option></select></div></div><div class="note">📌 達成度は、自治体・年数・目標が違えば単純には比べられません。このページでは<strong>同じ条件ごとにまとめ、その中だけ達成度順</strong>に並べています。</div><div class="toolbar"><div id="meta" class="meta">読み込み中…</div><button class="refresh" id="refresh" type="button">↻ 更新</button></div></section>
<div id="groups" class="groups"><div class="cards"><div class="skeleton"></div><div class="skeleton"></div></div></div>
<footer>投稿はゲーム終了後に本人が共有したものだけを表示します。管理シートで「非公開」に切り替えた投稿は自動的に一覧から外れます。</footer>
</div>
<script>
'use strict';
const API_URL='https://script.google.com/macros/s/AKfycbwH5sxrU6KpAnZOXhXB8acLA-1cH_OPEFavw_HDVYWGpF7FjgqEx8DnyoJUulC_6H6YZw/exec';
const $=id=>document.getElementById(id);let ALL=[];const CITY_ORDER=['haebaru','yonabaru','yaese','nanjo','nishihara'];
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function fmtMetric(k,v){const names={connection:'つながり',youth:'若者',child:'子ども',senior:'高齢者',stay:'町内滞在',industry:'産業',tourism:'観光',equity:'地区',acceptance:'納得',fatigue:'疲れ'};return '<div class="metric"><span>'+esc(names[k]||k)+'</span><b>'+Number(v||0)+'</b></div>'}
function optionFill(select,items,labelFn){const cur=select.value;select.innerHTML='<option value="">すべて</option>'+items.map(x=>'<option value="'+esc(x.value)+'">'+esc(labelFn(x))+'</option>').join('');select.value=cur}
function buildFilters(){const cityMap=new Map(),goalMap=new Map(),durs=new Set();ALL.forEach(x=>{cityMap.set(x.cityId,x.cityName);goalMap.set(x.goalId,x.goalName);durs.add(x.duration)});const cities=[...cityMap].map(([value,name])=>({value,name})).sort((a,b)=>CITY_ORDER.indexOf(a.value)-CITY_ORDER.indexOf(b.value));optionFill($('cityFilter'),cities,x=>x.name);optionFill($('durationFilter'),[...durs].sort((a,b)=>a-b).map(v=>({value:v,name:v+'年'})),x=>x.name);optionFill($('goalFilter'),[...goalMap].map(([value,name])=>({value,name})).sort((a,b)=>a.name.localeCompare(b.name,'ja')),x=>x.name)}
function annualHtml(list){if(!Array.isArray(list)||!list.length)return '<div class="tiny">年ごとの記録はありません。</div>';return list.slice().sort((a,b)=>Number(a.year)-Number(b.year)).map(r=>{const p=r.policies||{},tags=(r.priorityTags||[]).map(t=>'<span class="chip">'+esc(t)+'</span>').join('');const concerns=(r.concerns||[]).slice(0,2).map(c=>c.name+' '+c.pct+'%').join('／');return '<div class="year"><div class="yearTitle">'+esc(r.year)+'年目｜'+esc(r.dilemma?.label||'')+'</div><div class="tiny">継続：'+esc((p.continued||[]).join('、')||'なし')+'<br>新規：'+esc((p.newPolicies||[]).join('、')||'なし')+'<br>終了：'+esc((p.stopped||[]).join('、')||'なし')+'</div>'+(tags?'<div class="chips">'+tags+'</div>':'')+(concerns?'<div class="tiny">住民関心：'+esc(concerns)+'</div>':'')+(r.intent?'<div class="decision"><b>💭 なぜこの判断？</b>'+esc(r.intent)+'</div>':'')+(r.doubt?'<div class="decision"><b>🤔 迷ったこと</b>'+esc(r.doubt)+'</div>':'')+(r.insight?'<div class="decision"><b>💡 結果を見て気づいたこと</b>'+esc(r.insight)+'</div>':'')+'</div>'}).join('')}
function finalReflectionHtml(f){f=f||{};const items=[['全体の振り返り',f.overall],['いちばん迷った判断',f.hardest],['途中で考えが変わったこと',f.changed],['もう一度やるなら',f.retry]].filter(x=>x[1]);if(!items.length)return '<div class="tiny">全体の振り返りはありません。</div>';return '<div class="reflection">'+items.map(([k,v])=>'<div class="reflectItem"><b>'+esc(k)+'</b>'+esc(v)+'</div>').join('')+'</div>'}
function cardHtml(x,rank){const m=x.finalMetrics||{};return '<article class="card"><div class="cardTop"><div><div class="handle">'+esc(x.handle||'ななし')+'</div><div class="tiny">'+esc(x.approachName||'')+'</div></div><span class="order">同条件で '+rank+'番目</span></div><div class="achievement">'+Number(x.achievement||0)+'<small>%</small></div><div class="endingLabel">'+esc(x.endingLabel||'')+'</div><div class="phrase">🌿 '+esc(x.finalPhrase||'')+'</div>'+(x.finalReflection?.oneLine?'<div class="quote">💬「'+esc(x.finalReflection.oneLine)+'」</div>':'')+'<div class="metrics">'+fmtMetric('acceptance',m.acceptance)+fmtMetric('equity',m.equity)+fmtMetric('fatigue',m.fatigue)+'</div><details class="detail"><summary>🧭 '+esc(x.duration)+'年間の判断を見る</summary><div class="detailBody">'+annualHtml(x.annualReflections)+'</div></details><details class="detail"><summary>📝 全体の振り返りを見る</summary><div class="detailBody">'+finalReflectionHtml(x.finalReflection)+'</div></details></article>'}
function render(){const city=$('cityFilter').value,dur=$('durationFilter').value,goal=$('goalFilter').value;let rows=ALL.filter(x=>(!city||x.cityId===city)&&(!dur||Number(x.duration)===Number(dur))&&(!goal||x.goalId===goal));const groups=new Map();rows.forEach(x=>{const key=[x.cityId,x.duration,x.goalId].join('|');if(!groups.has(key))groups.set(key,[]);groups.get(key).push(x)});const sorted=[...groups.entries()].sort((a,b)=>{const A=a[1][0],B=b[1][0];let q=CITY_ORDER.indexOf(A.cityId)-CITY_ORDER.indexOf(B.cityId);if(q)return q;q=A.duration-B.duration;if(q)return q;return String(A.goalName).localeCompare(String(B.goalName),'ja')});$('groups').innerHTML='';if(!rows.length){$('groups').innerHTML='<div class="panel empty"><b>この条件の投稿はまだありません。</b><br>最初のまちづくりを共有してみよう。</div>';return}sorted.forEach(([,list])=>{list.sort((a,b)=>b.achievement-a.achievement||String(a.timestamp).localeCompare(String(b.timestamp)));const x=list[0],sec=document.createElement('section');sec.className='group';sec.innerHTML='<div class="groupHead"><h2>'+esc(x.cityName)+' × '+esc(x.duration)+'年 × '+esc(x.goalName)+'</h2><span class="groupCount">'+list.length+'件</span></div><div class="cards">'+list.map((r,i)=>cardHtml(r,i+1)).join('')+'</div>';$('groups').appendChild(sec)})}
async function load(){const b=$('refresh');b.disabled=true;$('meta').textContent='読み込み中…';try{const res=await fetch(API_URL+'?t='+Date.now(),{cache:'no-store',redirect:'follow'});if(!res.ok)throw new Error('HTTP '+res.status);const data=await res.json();if(data.error)throw new Error(data.error);ALL=Array.isArray(data.results)?data.results:[];buildFilters();render();$('meta').textContent=ALL.length+'件の共有 ・ 更新 '+new Date(data.updatedAt||Date.now()).toLocaleString('ja-JP')}catch(err){$('groups').innerHTML='<div class="panel error"><b>共有データを読み込めませんでした。</b><br>少し待って「更新」を押してください。<br><span class="meta">'+esc(err.message||err)+'</span></div>';$('meta').textContent='接続エラー'}finally{b.disabled=false}}
['cityFilter','durationFilter','goalFilter'].forEach(id=>$(id).addEventListener('change',render));$('refresh').addEventListener('click',load);$('resetFilters').addEventListener('click',()=>{$('cityFilter').value='';$('durationFilter').value='';$('goalFilter').value='';render()});load();setInterval(load,60000);
</script>
</body>
</html>
