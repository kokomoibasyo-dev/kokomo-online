<!doctype html><html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ここもオンライン v0.37</title>
<style>body{font-family:system-ui,-apple-system,sans-serif;background:#eef6e9;color:#25382f;display:grid;place-items:center;min-height:100vh;margin:0}.box{padding:24px;text-align:center;line-height:1.8}</style>
</head><body><div class="box">ここもオンラインを読み込んでいます…</div>
<script>
(async()=>{
 try{
  if(!('DecompressionStream' in window)) throw new Error('このブラウザでは読み込み機能が使えません。Safari / Chrome を最新版に更新してください。');
  const ps=Array.from({length:20},(_,i)=>`p${String(i).padStart(2,'0')}.txt`);
  const base='./v037/';
  const chunks=await Promise.all(ps.map(p=>fetch(base+p+'?v=37.2',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(p+': '+r.status);return r.text()})));
  const b64=chunks.join('').trim();
  const bin=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));
  const ds=new DecompressionStream('gzip');
  const html=await new Response(new Blob([bin]).stream().pipeThrough(ds)).text();
  document.open();document.write(html);document.close();
 }catch(e){
  document.body.innerHTML='<div class="box"><b>読み込みに失敗しました。</b><br>'+String(e)+'</div>';
 }
})();
</script><!-- loader fixed: same-origin relative fetch --></body></html>
