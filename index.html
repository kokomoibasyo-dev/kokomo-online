(()=>{
  document.title='ここもオンライン v0.39';
  const brand=document.querySelector('.brand small');if(brand)brand.textContent='2Dドット空間 JRPG games v0.39';
  const hint=document.getElementById('hint');if(hint)hint.textContent='↑↓←→ で歩けます。スマホは左のジョイスティックで移動、右のAボタンで選べます。';
  const state=document.getElementById('jsState');if(state){state.textContent='● 操作準備OK v0.39（スマホ四目ならべ画面修正版）';state.classList.add('ready');}

  const KD={
    plaza:[
      {side:'top',from:280,to:360,target:'study',label:'学習室',spawn:{x:320,y:348,dir:'up'}},
      {side:'bottom',from:280,to:360,target:'quiet',label:'静かな部屋',spawn:{x:320,y:52,dir:'down'}},
      {side:'left',from:160,to:240,target:'lounge',label:'ラウンジ',spawn:{x:588,y:200,dir:'left'}},
      {side:'right',from:160,to:240,target:'game',label:'ゲーム部屋',spawn:{x:52,y:200,dir:'right'}}
    ],
    study:[{side:'bottom',from:280,to:360,target:'plaza',label:'広場へ',spawn:{x:320,y:52,dir:'down'}}],
    quiet:[{side:'top',from:280,to:360,target:'plaza',label:'広場へ',spawn:{x:320,y:348,dir:'up'}}],
    lounge:[{side:'right',from:160,to:240,target:'plaza',label:'広場へ',spawn:{x:52,y:200,dir:'right'}}],
    game:[{side:'left',from:160,to:240,target:'plaza',label:'広場へ',spawn:{x:588,y:200,dir:'left'}}]
  };
  const wallT=24;
  function doors(key=current){return KD[key]||[]}
  function boundary(side){
    const ds=doors().filter(x=>x.side===side).sort((a,b)=>a.from-b.from);
    const len=(side==='top'||side==='bottom')?W:H,out=[];let cur=0;
    for(const x of ds){const a=clamp(x.from,0,len),b=clamp(x.to,0,len);if(a>cur){if(side==='top')out.push({x:cur,y:0,w:a-cur,h:wallT});if(side==='bottom')out.push({x:cur,y:H-wallT,w:a-cur,h:wallT});if(side==='left')out.push({x:0,y:cur,w:wallT,h:a-cur});if(side==='right')out.push({x:W-wallT,y:cur,w:wallT,h:a-cur});}cur=Math.max(cur,b)}
    if(cur<len){if(side==='top')out.push({x:cur,y:0,w:len-cur,h:wallT});if(side==='bottom')out.push({x:cur,y:H-wallT,w:len-cur,h:wallT});if(side==='left')out.push({x:0,y:cur,w:wallT,h:len-cur});if(side==='right')out.push({x:W-wallT,y:cur,w:wallT,h:len-cur});}
    return out;
  }
  roomWalls=()=>[...boundary('top'),...boundary('bottom'),...boundary('left'),...boundary('right')];
  function drawDoors(){for(const x of doors()){if(x.side==='top')drawDoor(x.from,0,x.to-x.from,wallT,x.label);else if(x.side==='bottom')drawDoor(x.from,H-wallT,x.to-x.from,wallT,x.label);else if(x.side==='left')drawDoor(0,x.from,wallT,x.to-x.from,x.label);else drawDoor(W-wallT,x.from,wallT,x.to-x.from,x.label)}}
  drawScene=()=>{if(current==='plaza')drawTileFloor('#e7e2d6','#f1ede3');if(current==='study')drawTileFloor('#e5cfaa','#efdcbc');if(current==='lounge')drawTileFloor('#e7d1ba','#f1dfcc');if(current==='quiet')drawTileFloor('#d9e9ee','#e6f1f3');if(current==='game')drawTileFloor('#d8d1e7','#e5dfef');drawFineFloorOverlay();drawWalls();drawFineWallOverlay();drawRoomDecor();drawAmbientMicroDecor();drawDoors();furniture().forEach(o=>{drawFurniture(o);drawFurnitureMicroDetail(o)});drawAvatar()};
  const wallBox=(x,y)=>({x:x-player.w/2+3,y:y-player.h+3,w:player.w-6,h:player.h-3});
  collide=(nx,ny)=>{const b=wallBox(nx,ny);for(const x of roomWalls())if(rectHit(b,x))return true;const ob={x:nx,y:ny,w:player.w,h:player.h};for(const o of solidObjects())if(rectHit(ob,o))return true;return false};
  function fits(x){const m=player.w/2+3,c=(x.side==='top'||x.side==='bottom')?player.x:player.y;return c>=x.from+m&&c<=x.to-m}
  function crossed(x){if(x.side==='top')return player.y<=8;if(x.side==='bottom')return player.y>=H-8;if(x.side==='left')return player.x<=8;if(x.side==='right')return player.x>=W-8;return false}
  checkDoors=()=>{for(const x of doors())if(fits(x)&&crossed(x))return enterRoom(x.target,x.spawn)};
  enterRoom=(key,pos)=>{if(current==='lounge'&&key!=='lounge')standUp(true);if(current==='study'&&key!=='study')standFromStudyDesk(true);current=key;player.x=pos.x;player.y=pos.y;if(pos.dir)player.dir=pos.dir;player.step=0;document.getElementById('roomLabel').textContent=rooms[key].name;document.getElementById('roomInfo').textContent=rooms[key].info;updateLoungePanel();toast(rooms[key].name+' に入りました')};
})();`;

  loading.style.display='none';
});
