<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f3ead8"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="ギリシャ人"><title>あなたもこれでギリシャ人。</title><style>:root{--paper:#fffaf0;--ink:#17191d;--navy:#153f62;--gold:#ae7e28;--line:#d8c39b;--muted:#746b5f}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0,#fff9ed,#e9dfcd 70%);font-family:"Hiragino Mincho ProN","Yu Mincho",serif;color:var(--ink)}.wrap{max-width:780px;margin:auto;padding:16px 14px 40px}.panel{background:rgba(255,250,240,.96);border:1px solid var(--line);border-radius:24px;box-shadow:0 18px 45px #6c57311f}header{padding:28px 20px;text-align:center}.k{font:700 12px/1.2 Georgia,serif;letter-spacing:.2em;color:var(--gold)}h1{font-size:clamp(34px,9vw,58px);line-height:1.04;margin:9px 0 12px}header p{color:var(--muted);line-height:1.8;margin:0 auto 22px;max-width:580px}.form{display:grid;gap:10px}input{width:100%;padding:16px 15px;border:1px solid var(--line);border-radius:14px;font-size:16px;background:#fff}.gender{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.gender label{padding:12px 6px;background:#fff;border:1px solid var(--line);border-radius:13px;font-size:13px;cursor:pointer}.gender input{display:none}.gender label:has(input:checked){background:#eef3f5;border-color:var(--navy);box-shadow:inset 0 0 0 1px var(--navy)}button{border:0;border-radius:14px;padding:15px;background:var(--navy);color:#fff;font-size:16px;font-weight:700;cursor:pointer}.small{font-size:11px;color:var(--muted);margin-top:10px}#result{display:none;margin-top:16px}#result.show{display:block}.meaning{padding:18px;margin-bottom:14px}.tag{color:var(--gold);font:700 12px/1.2 sans-serif;letter-spacing:.08em}.meaning h2{font-size:25px;margin:6px 0 10px}.chips{display:flex;flex-wrap:wrap;gap:7px}.chip{background:#f4ecdc;border:1px solid #dfcfad;padding:7px 9px;border-radius:999px;font-size:13px}.cert{overflow:hidden}.laurel{padding:14px 18px 8px;text-align:center;color:var(--gold);font-weight:700;letter-spacing:.08em}.laurel:before,.laurel:after{content:"❧";margin:0 12px}.art{width:calc(100% - 24px);margin:0 12px;aspect-ratio:2/3;background-image:none;background-size:400% 400%;image-rendering:auto;border:1px solid var(--gold);border-radius:4px;background-repeat:no-repeat}.certbody{padding:18px 18px 22px;text-align:center}.greekscript{color:var(--gold);font:18px Georgia,serif}.greekname{font-size:clamp(36px,9vw,56px);font-weight:800;margin:3px 0}.epithet{font-size:20px;margin-bottom:14px}.rule{height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:12px 0}.story{text-align:left;font-size:15px;line-height:1.9;color:#3f3a34}.facts{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px;text-align:left}.fact{padding:10px;background:#fbf6ea;border:1px solid #eadcbe;border-radius:12px}.fact b{display:block;color:var(--gold);font-size:11px;margin-bottom:4px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.actions button:nth-child(2){background:#8b6a31}canvas{display:none}@media(max-width:520px){.facts{grid-template-columns:1fr}.actions{grid-template-columns:1fr}}</style></head><body><div class="wrap"><header class="panel"><div class="k">ANCIENT NAME MACHINE</div><h1>あなたもこれで<br>ギリシャ人。</h1><p>名前の漢字がもつポジティブな意味を読み解き、古代ギリシャ風の名前・物語・証明書に変換します。</p><div class="form"><input id="name" placeholder="名前（例：大地）" maxlength="12"><input id="reading" placeholder="読み・任意（例：だいち）" maxlength="20"><div class="gender"><label><input type="radio" name="gender" value="male" checked>男性として生きる</label><label><input type="radio" name="gender" value="female">女性として生きる</label><label><input type="radio" name="gender" value="oracle">神託にまかせる</label></div><button id="go">ギリシャへ行く</button></div><div class="small">※姓名判断ではありません。漢字の意味とギリシャ語人名をもとにした遊びです。</div></header><main id="result"><section class="panel meaning"><div class="tag">NAME READING</div><h2 id="meaningTitle"></h2><div id="chips" class="chips"></div><p id="meaningText"></p></section><section class="panel cert" id="certificate"><div class="laurel">名に、物語を</div><div id="art" class="art"></div><div class="certbody"><div id="greekScript" class="greekscript"></div><div id="greekName" class="greekname"></div><div id="epithet" class="epithet"></div><div class="rule"></div><div id="story" class="story"></div><div class="facts"><div class="fact"><b>都市国家</b><span id="city"></span></div><div class="fact"><b>役割</b><span id="role"></span></div><div class="fact"><b>得意なこと</b><span id="skill"></span></div><div class="fact"><b>人々からの呼び名</b><span id="alias"></span></div></div><div class="actions"><button id="save">証明書を画像保存</button><button id="again">別の名前で遊ぶ</button></div></div></section></main></div><canvas id="canvas" width="1080" height="1620"></canvas><script>(()=>{const D={'大':['大きさ・おおらかさ','nature'],'地':['大地・足元・支える力','nature'],'海':['海・広がり・航海','sea'],'空':['空・高み・自由','sea'],'星':['星・道しるべ・輝き','sacred'],'光':['光・明るさ・照らす力','people'],'陽':['太陽・あたたかさ・生命力','nature'],'月':['月・静けさ・直感','sacred'],'風':['風・動き・自由','sea'],'森':['森・生命・深さ','nature'],'花':['花・美しさ・開花','art'],'英':['秀でる・才知・卓越','sage'],'孝':['敬う・大切にする・徳','harmony'],'智':['知恵・思慮','sage'],'知':['知る・理解・知恵','sage'],'賢':['判断力・知恵','sage'],'勇':['勇気・前へ進む力','hero'],'武':['武勇・強さ','hero'],'勝':['勝利・成し遂げる力','hero'],'希':['希望・願い','people'],'望':['希望・見通す力','people'],'愛':['愛・慈しみ','harmony'],'仁':['思いやり・慈しみ','harmony'],'和':['調和・平穏','harmony'],'平':['平和・穏やかさ','harmony'],'結':['結ぶ・つながり','harmony'],'絆':['絆・つながり','harmony'],'友':['友情・仲間','harmony'],'真':['真実・まこと','sage'],'誠':['誠実・真心','sage'],'正':['正しさ・公正','people'],'義':['正義・筋を通す','people'],'明':['明るさ・明晰さ','people'],'輝':['輝き・光','art'],'翔':['飛ぶ・高く進む','sea'],'翼':['翼・飛翔','sea'],'洋':['大海・広がり','sea'],'航':['航海・旅立ち','sea'],'湊':['港・人が集まる場所','sea'],'浩':['水の広がり・豊かさ','sea'],'拓':['切り開く・土地を広げる','nature'],'耕':['耕す・育む','nature'],'実':['実り・確かさ','nature'],'豊':['豊かさ・満ちる力','nature'],'穂':['穀物・実り・成長','nature'],'恵':['恵み・思いやり','nature'],'春':['春・始まり・花開く','nature'],'晴':['晴れやかさ・光','people'],'健':['健やかさ・強さ','hero'],'剛':['強さ・揺るがなさ','hero'],'毅':['強い意志・不屈','hero'],'志':['志・目指すもの','people'],'理':['理・筋道・理解','sage'],'哲':['深く考える・知恵','sage'],'学':['学ぶ・知を求める','sage'],'創':['創る・新しく始める','art'],'美':['美・調和・華やかさ','art'],'華':['華やかさ・花開く','art'],'雅':['気品・洗練','art'],'祈':['祈り・願い','sacred'],'聖':['尊さ・神聖さ','sacred'],'信':['信頼・信じる心','sacred'],'願':['願い・希望','sacred'],'心':['心・魂・思い','sacred']};const themes={hero:{jp:'英雄',sub:'勇気・勝利・不屈',m:['アンドレアス','Ἀνδρέας'],f:['ニケ','Νίκη']},sage:{jp:'知恵',sub:'知識・哲学・探究',m:['ソフォクレス','Σοφοκλῆς'],f:['ソフィア','Σοφία']},harmony:{jp:'調和',sub:'平和・結び・対話',m:['エイレナイオス','Εἰρηναῖος'],f:['エイレネ','Εἰρήνη']},nature:{jp:'自然',sub:'大地・生命・実り',m:['ゲオルギオス','Γεώργιος'],f:['ゲオルギア','Γεωργία']},sea:{jp:'海',sub:'航海・挑戦・広がり',m:['タラッシオス','Θαλάσσιος'],f:['タラッサ','Θάλασσα']},art:{jp:'芸術',sub:'美・創造・表現',m:['アポロニオス','Ἀπολλώνιος'],f:['カリオペ','Καλλιόπη']},sacred:{jp:'神聖',sub:'信仰・神秘・祈り',m:['エウセビオス','Εὐσέβιος'],f:['セレネ','Σελήνη']},people:{jp:'民',sub:'導き・社会・希望',m:['デメトリオス','Δημήτριος'],f:['エルピス','Ἐλπίς']}};const order=['hero','sage','harmony','nature','sea','art','sacred','people'];const roles={hero:['都市の守り手','遠征隊の旗手'],sage:['学び舎の記録者','若者に問う哲学者'],harmony:['広場の調停者','家々をつなぐ相談役'],nature:['畑と市場を結ぶ世話人','収穫祭の取りまとめ役'],sea:['港の航海者','旅人の案内役'],art:['祭礼の詩人','工房の創作者'],sacred:['神殿の祈り手','祭礼の記録役'],people:['民衆の先導者','広場の世話人']};const cities=['アテナイ','コリントス','ミレトス','ナクソス島','クレタ島の港町','アッティカ郊外'];const skills=['人の話を最後まで聞くこと','難しいことを物語にすること','知らない人同士をつなぐこと','地図を読み、道を見つけること','議論の論点を整理すること','小さな変化に気づくこと'];function h(s){let x=2166136261;for(const c of s){x^=c.codePointAt(0);x=Math.imul(x,16777619)}return x>>>0}function pick(a,x,n=0){return a[(x+n)%a.length]}function analyze(name){const xs=[...name].map(c=>D[c]?[c,...D[c]]:null).filter(Boolean);const score=Object.fromEntries(order.map(k=>[k,0]));xs.forEach(x=>score[x[2]]++);let t=order.sort((a,b)=>score[b]-score[a])[0];if(!xs.length)t='people';return{xs,t}}function setArt(idx){const col=idx%4,row=Math.floor(idx/4);art.style.backgroundPosition=`${col*100/3}% ${row*100/3}%`}art.style.backgroundImage='url('+SPRITE+')';
function generate(){const name=document.querySelector('#name').value.trim();if(!name)return alert('名前を入力してください');const reading=document.querySelector('#reading').value.trim();let gender=document.querySelector('input[name=gender]:checked').value;if(gender==='oracle')gender=h(name+reading)%2?'male':'female';const a=analyze(name),t=a.t,T=themes[t],x=h(name+reading+gender),nm=gender==='female'?T.f:T.m;meaningTitle.textContent=`${name}という名から見えるもの`;chips.innerHTML=(a.xs.length?a.xs:[[name,'名前全体の響き・物語',t]]).map(v=>`<span class=chip>${v[0]}｜${v[1]}</span>`).join('');meaningText.innerHTML=`中心テーマは <b>${T.jp}</b>。${T.sub} の方向から、あなたの名前を古代ギリシャ風の物語へつなぎます。`;greekScript.textContent=nm[1];greekName.textContent=nm[0];epithet.textContent=`「${T.sub.split('・').join('と')}を宿す者」`;city.textContent=pick(cities,x);role.textContent=pick(roles[t],x,2);skill.textContent=pick(skills,x,5);alias.textContent=`「${pick(['静かな','黄金の','遠くを見る','人を結ぶ','問いを持つ','風を読む'],x,7)}${T.jp}の人」`;const year=350+x%110;story.textContent=`紀元前${year}年ごろ、${city.textContent}に生まれる。名前に刻まれた「${a.xs.map(v=>v[1].split('・')[0]).slice(0,3).join('・')||'希望'}」を大切にしながら、${role.textContent}として暮らした。人々は、答えを急ぐよりも相手の話を聞き、必要なときに一歩前へ出るその姿を覚えていたという。これは史実ではなく、あなたの名から生まれた架空の一生である。`;const idx=order.indexOf(t)*2+(gender==='female'?1:0);setArt(idx);result.classList.add('show');setTimeout(()=>result.scrollIntoView({behavior:'smooth'}),20)}go.onclick=generate;again.onclick=()=>window.scrollTo({top:0,behavior:'smooth'});save.onclick=()=>{const c=canvas,ctx=c.getContext('2d');ctx.fillStyle='#fff8ea';ctx.fillRect(0,0,c.width,c.height);ctx.fillStyle='#a47727';ctx.textAlign='center';ctx.font='bold 34px serif';ctx.fillText('名に、物語を',540,68);ctx.strokeStyle='#a47727';ctx.lineWidth=4;ctx.strokeRect(32,30,1016,1560);const img=new Image();img.onload=()=>{const idx=order.indexOf(analyze(name.value.trim()).t)*2+((document.querySelector('input[name=gender]:checked').value==='female')?1:0);const sx=(idx%4)*180,sy=Math.floor(idx/4)*270;ctx.drawImage(img,sx,sy,180,270,135,120,810,1215);ctx.fillStyle='#fff8ea';ctx.fillRect(80,1260,920,290);ctx.fillStyle='#111';ctx.font='bold 70px serif';ctx.fillText(greekName.textContent,540,1355);ctx.font='34px serif';ctx.fillText(epithet.textContent,540,1415);ctx.font='26px serif';ctx.fillText(name.value+' → '+greekScript.textContent,540,1475);const a=document.createElement('a');a.download='greek-certificate-'+name.value+'.png';a.href=c.toDataURL('image/png');a.click()};img.src=SPRITE};['name','reading'].forEach(id=>document.getElementById(id).addEventListener('keydown',e=>{if(e.key==='Enter')generate()}))})();</script></body></html>
