祭礼の詩人','工房の創作者'],sacred:['神殿の祈り手','祭礼の記録役'],people:['民衆の先導者','広場の世話人']};const cities=['アテナイ','コリントス','ミレトス','ナクソス島','クレタ島の港町','アッティカ郊外'];const skills=['人の話を最後まで聞くこと','難しいことを物語にすること','知らない人同士をつなぐこと','地図を読み、道を見つけること','議論の論点を整理すること','小さな変化に気づくこと'];function h(s){let x=2166136261;for(const c of s){x^=c.codePointAt(0);x=Math.imul(x,16777619)}return x>>>0}function pick(a,x,n=0){return a[(x+n)%a.length]}function analyze(name){const xs=[...name].map(c=>D[c]?[c,...D[c]]:null).filter(Boolean);const score=Object.fromEntries(order.map(k=>[k,0]));xs.forEach(x=>score[x[2]]++);let t=order.sort((a,b)=>score[b]-score[a])[0];if(!xs.length)t='people';return{xs,t}}function setArt(idx){const col=idx%4,row=Math.floor(idx/4);art.style.backgroundPosition=`${col*100/3}% ${row*100/3}%`}function generate(){const name=document.querySelector('#name').value.trim();if(!name)return alert('名前を入力してください');const reading=document.querySelector('#reading').value.trim();let gender=document.querySelector('input[name=gender]:checked').value;if(gender==='oracle')gender=h(name+reading)%2?'male':'female';const a=analyze(name),t=a.t,T=themes[t],x=h(name+reading+gender),nm=gender==='female'?T.f:T.m;meaningTitle.textContent=`${name}という名から見えるもの`;chips.innerHTML=(a.xs.length?a.xs:[[name,'名前全体の響き・物語',t]]).map(v=>`<span class=chip>${v[0]}｜${v[1]}</span>`).join('');meaningText.innerHTML=`中心テーマは <b>${T.jp}</b>。${T.sub} の方向から、あなたの名前を古代ギリシャ風の物語へつなぎます。`;greekScript.textContent=nm[1];greekName.textContent=nm[0];epithet.textContent=`「${T.sub.split('・').join('と')}を宿す者」`;city.textContent=pick(cities,x);role.textContent=pick(roles[t],x,2);skill.textContent=pick(skills,x,5);alias.textContent=`「${pick(['静かな','黄金の','遠くを見る','人を結ぶ','問いを持つ','風を読む'],x,7)}${T.jp}の人」`;const year=350+x%110;story.textContent=`紀元前${year}年ごろ、${city.textContent}に生まれる。名前に刻まれた「${a.xs.map(v=>v[1].split('・')[0]).slice(0,3).join('・')||'希望'}」を大切にしながら、${role.textContent}として暮らした。人々は、答えを急ぐよりも相手の話を聞き、必要なときに一歩前へ出るその姿を覚えていたという。これは史実ではなく、あなたの名から生まれた架空の一生である。`;const idx=order.indexOf(t)*2+(gender==='female'?1:0);setArt(idx);result.classList.add('show');setTimeout(()=>result.scrollIntoView({behavior:'smooth'}),20)}go.onclick=generate;again.onclick=()=>window.scrollTo({top:0,behavior:'smooth'});save.onclick=()=>{const c=canvas,ctx=c.getContext('2d');ctx.fillStyle='#fff8ea';ctx.fillRect(0,0,c.width,c.height);ctx.fillStyle='#a47727';ctx.textAlign='center';ctx.font='bold 34px serif';ctx.fillText('名に、物語を',540,68);ctx.strokeStyle='#a47727';ctx.lineWidth=4;ctx.strokeRect(32,30,1016,1560);const img=new Image();img.onload=()=>{const idx=order.indexOf(analyze(name.value.trim()).t)*2+((document.querySelector('input[name=gender]:checked').value==='female')?1:0);const sx=(idx%4)*180,sy=Math.floor(idx/4)*270;ctx.drawImage(img,sx,sy,180,270,135,120,810,1215);ctx.fillStyle='#fff8ea';ctx.fillRect(80,1260,920,290);ctx.fillStyle='#111';ctx.font='bold 70px serif';ctx.fillText(greekName.textContent,540,1355);ctx.font='34px serif';ctx.fillText(epithet.textContent,540,1415);ctx.font='26px serif';ctx.fillText(name.value+' → '+greekScript.textContent,540,1475);const a=document.createElement('a');a.download='greek-certificate-'+name.value+'.png';a.href=c.toDataURL('image/png');a.click()};img.src='data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAA0JCgwKCA0MCwwPDg0QFCIWFBISFCkdHxgiMSszMjArLy42PE1CNjlJOi4vQ1xESVBSV1dXNEFfZl5UZU1VV1P/2wBDAQ4PDxQSFCcWFidTNy83U1NTU1NTU1NTU1NTU1NTU1NTU1NTU1NTU1NTU1NTU1NTU1NTU1NTU1NTU1NTU1NTU1P/wgARCAQ4AtADASIAAhEBAxEB/8QAGwAAAgMBAQEAAAAAAAAAAAAAAwQBAgUABgf/xAAZAQADAQEBAAAAAAAAAAAAAAAAAQIDBAX/2gAMAwEAAhADEAAAAd6R2yu/VsHd3CCZVpOJVvSYrZIHIVsDIbCTY6JCejg6I4O7uRbqyy3RIupdcZ5hZpvgHDoz7NPQA6dLgYl9Ew10RI4msILw7smegXCKqm3EqUm5XOEcnLTfLlTqVZiX09zOiaBaswiL0sFprZnd3CHcVxzZe7RqXSaalUoGCUE0x3cLomg5joQuPOhvYHWkuxcSlztExbudiUq7RoWzZa0IRsm7Ch87PFL5XE1snWbDAgbpiY7DaZpjRuDlwIo1bYvNbVkJ6cnoSlD8L2y0NW1E7dIQv1LCuE3lJe7PnCh6BjzWkm12BWl6PvPWa9FfzOqnqdhnmtImDroPUNNobhMoMKixcq9Ez5TdAy6yCraRPnA0fKZaenMvD2C5mjSBCq9zrkTNpNKGEIrCTs1aq52dfrQ/Ltp6ipg6aaCDV
